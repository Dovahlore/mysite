user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 35m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    # Development uses one catch-all HTTP host. Do not include conf.d here:
    # the stock Nginx default server would otherwise capture localhost.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost 127.0.0.1 _;

        location /static/ {
            alias /usr/share/nginx/html/static/;
            add_header Cache-Control "no-store";
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            add_header Cache-Control "no-store";
        }

        # Streaming endpoints must not be buffered.
        location = /base/api/common_ai_polish/ {
            include uwsgi_params;
            uwsgi_connect_timeout 300s;
            uwsgi_read_timeout 300s;
            uwsgi_send_timeout 300s;
            uwsgi_buffering off;
            gzip off;
            uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
            uwsgi_param HTTP_X_FORWARDED_HOST $host;
            uwsgi_pass web:8888;
        }

        location = /s/agent/chat {
            include uwsgi_params;
            uwsgi_connect_timeout 300s;
            uwsgi_read_timeout 300s;
            uwsgi_send_timeout 300s;
            uwsgi_buffering off;
            gzip off;
            uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
            uwsgi_param HTTP_X_FORWARDED_HOST $host;
            uwsgi_pass web:8888;
        }

        location / {
            include uwsgi_params;
            uwsgi_connect_timeout 300s;
            uwsgi_read_timeout 300s;
            uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
            uwsgi_param HTTP_X_FORWARDED_HOST $host;
            uwsgi_pass web:8888;
        }
    }
}
