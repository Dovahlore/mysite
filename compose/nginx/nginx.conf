user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 35m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    include /etc/nginx/conf.d/*.conf;


    # =====================
    # HTTP → HTTPS 强制跳转
    # =====================
    server {
        listen 80;
        server_name localhost www.dovahwall.cn g1.dovahwall.cn g2.dovahwall.cn portainer.dovahwall.cn;

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # =====================
    # 主站（Django）
    # =====================
    server {
        listen 443 ssl;
        server_name localhost www.dovahwall.cn;

        ssl_certificate       /etc/nginx/ssl/www.dovahwall.cn.pem;
        ssl_certificate_key   /etc/nginx/ssl/www.dovahwall.cn.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # 静态资源
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
        }

        # Django（uwsgi）
        # Streaming AI endpoints must bypass uWSGI and gzip buffering.
        location = /base/api/common_ai_polish/ {
            include uwsgi_params;
            uwsgi_connect_timeout 300s;
            uwsgi_buffering off;
            gzip off;
            uwsgi_pass web:8888;
        }

        location = /s/agent/chat {
            include uwsgi_params;
            uwsgi_connect_timeout 300s;
            uwsgi_buffering off;
            gzip off;
            uwsgi_pass web:8888;
        }

        location / {
            include uwsgi_params;
            uwsgi_connect_timeout 300s;
            uwsgi_pass web:8888;
        }


    }


    # =====================
    # Gradio 1（8033）
    # =====================
    server {
        listen 443 ssl;
        server_name g1.dovahwall.cn;

        ssl_certificate       /etc/nginx/ssl/www.dovahwall.cn.pem;
        ssl_certificate_key   /etc/nginx/ssl/www.dovahwall.cn.key;

        location / {
            proxy_pass http://127.0.0.1:8033;

            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }


    # =====================
    # Gradio 2（8044）
    # =====================
    server {
        listen 443 ssl;
        server_name g2.dovahwall.cn;

        ssl_certificate       /etc/nginx/ssl/www.dovahwall.cn.pem;
        ssl_certificate_key   /etc/nginx/ssl/www.dovahwall.cn.key;

        location / {
            proxy_pass http://127.0.0.1:8044;

            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }


    # =====================
    # Portainer（9443）
    # =====================
    server {
        listen 443 ssl;
        server_name portainer.dovahwall.cn;

        ssl_certificate       /etc/nginx/ssl/www.dovahwall.cn.pem;
        ssl_certificate_key   /etc/nginx/ssl/www.dovahwall.cn.key;

        location / {
            proxy_pass https://127.0.0.1:9443;

            proxy_ssl_verify off;

            proxy_set_header Host $host;
        }
    }
}
