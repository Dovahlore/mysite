volumes: # 自定义数据卷
  db_vol: #定义数据卷同步存放容器内mysql数据
  redis_vol: #定义数据卷同步存放redis数据
  media_vol: #定义数据卷同步存放web项目用户上传到media文件夹的数据
  static_vol: #定义数据卷同步存放web项目static文件夹的数据
networks:
  back:
services:
  redis:
    image: redis:latest
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_vol:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    pids_limit: 64
    networks:
      - back
  db:
    image: mysql:latest
    container_name: db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysite}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_vol:/var/lib/mysql:rw # 挂载数据库数据, 可读可写
      - ./compose/mysql/init:/docker-entrypoint-initdb.d
      - ./compose/mysql/low-memory.cnf:/etc/mysql/conf.d/zz-low-memory.cnf:ro
    ports:
      - "33062:3306" # 与配置文件保持一致
    restart: always
    mem_limit: ${MYSQL_MEMORY_LIMIT:-512m}
    pids_limit: 128
    entrypoint: [
      "sh", "-c",
      "docker-entrypoint.sh mysqld && \
           mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS mybase;'"
    ]
    networks:
      - back
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "80"
      - "443"
    volumes:
      - ./compose/nginx/nginx.conf:/etc/nginx/nginx.conf # 挂载nginx配置文件
      - static_vol:/usr/share/nginx/html/static
      - media_vol:/usr/share/nginx/html/media
      - ./compose/nginx/cert:/etc/nginx/ssl
    networks:
      - back
    links:
      - web
    depends_on:
      - web
    restart: always
    mem_limit: ${NGINX_MEMORY_LIMIT:-96m}
    pids_limit: 64
  web:
    build: ./myproject
    image: ${APP_IMAGE:-docker-mysite-app:latest}
    container_name: web
    working_dir: /mysite
    ports:
      - "8888:8888"
    environment:
      # Keep credentials outside source control (for example in a server-side .env file).
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysite}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      AI_CONFIG_FILE: /run/config/ai_config.yaml
      AGENT_DB_USER: ${AGENT_DB_USER:-}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      AGENT_DB_NAME: ${AGENT_DB_NAME:-mysite}
      AGENT_DB_HOST: ${AGENT_DB_HOST:-db}
      AGENT_DB_PORT: ${AGENT_DB_PORT:-3306}
    volumes:
      # The authenticated settings page updates this single source of AI config.
      - ./ai_config.yaml:/run/config/ai_config.yaml:rw
      - media_vol:/mysite/media # 以数据卷挂载容器内用户上传媒体文件
      - static_vol:/mysite/collect_static
    #  - ./compose/uwsgi:/tmp # 挂载uwsgi日志
    networks:
      - back
    links:
      - db
      - redis
    depends_on:
      - db
      - redis
    restart: always
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    pids_limit: 128
    tty: true
    stdin_open: true
  scheduler:
    image: ${APP_IMAGE:-docker-mysite-app:latest}
    container_name: scheduler
    working_dir: /mysite
    entrypoint: ["python3", "manage.py", "run_igpsport_scheduler"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysite}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      IGPSPORT_USERNAME: ${IGPSPORT_USERNAME:?Set IGPSPORT_USERNAME in .env}
      IGPSPORT_PASSWORD: ${IGPSPORT_PASSWORD:?Set IGPSPORT_PASSWORD in .env}
      IGPSPORT_LOOKBACK_DAYS: ${IGPSPORT_LOOKBACK_DAYS:-14}
      IGPSPORT_SYNC_TIMEOUT_SECONDS: ${IGPSPORT_SYNC_TIMEOUT_SECONDS:-1800}
    volumes:
      - media_vol:/mysite/media
    networks:
      - back
    depends_on:
      - web
    restart: always
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-384m}
    pids_limit: 64
