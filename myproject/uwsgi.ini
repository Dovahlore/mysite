[uwsgi]
chdir = /mysite
module = mysite.wsgi:application
master = true
socket = 0.0.0.0:8888

# One process avoids duplicating Django/OpenAI/Pillow imports on a 2 GB host.
# Threads retain concurrency for database and model-provider I/O.
processes = 1
threads = 4
enable-threads = true
thunder-lock = true
single-interpreter = true

# Recycle memory retained after image/FIT parsing and long-lived AI requests.
max-requests = 300
max-requests-delta = 50
reload-on-rss = 320
worker-reload-mercy = 30

vacuum = true
die-on-term = true
buffer-size = 65535
