{% load static %}{% for tool in tools %}<a href="{{ tool.url }}" class="tool-card"{% if tool.preview %} data-preview="{% static tool.preview %}" data-preview-type="{{ tool.preview_type }}"{% endif %}>
    {% if tool.icon_img %}
        <span class="tool-icon tool-icon-img"><img src="{% static tool.icon_img %}" alt="{{ tool.name }}图标"></span>
    {% else %}
        <span class="tool-icon"{% if tool.icon_color %} style="color:{{ tool.icon_color }};"{% endif %}><i class="{{ tool.icon_fa }}" aria-hidden="true"></i></span>
    {% endif %}
    <span class="tool-name">{{ tool.name }}</span>
    <span class="tool-desc">{{ tool.desc }}</span>
</a>
{% endfor %}<script>
/* 悬停整页背景预览(drop-in:工具目录放 preview.mp4/.webm/.gif/.png/.jpg 即生效)。
   hover 工具卡时,页面全屏背景(DJI 波浪视频)暂停并淡入该工具的真实预览画面;
   移开即淡出并恢复背景视频。媒体首次悬停才加载;reduced-motion 用户不启用。 */
(function () {
    "use strict";
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    function layer() {
        var el = document.getElementById("hover-bg-layer");
        if (el) return el;
        el = document.createElement("div");
        el.id = "hover-bg-layer";
        el.className = "hover-bg-layer";
        el.setAttribute("aria-hidden", "true");
        (document.body || document.documentElement).appendChild(el);
        return el;
    }

    var generation = 0;
    var resumeBackground = false;

    function hide() {
        generation += 1;
        var el = document.getElementById("hover-bg-layer");
        if (el) {
            el.classList.remove("on");
            var media = el.firstElementChild;
            if (media && media.tagName === "VIDEO") {
                media.pause();
                try { media.currentTime = 0; } catch (e) {}
            }
        }
        var bg = document.querySelector("video.video-background");
        if (bg && resumeBackground) {
            var pr = bg.play();
            if (pr && pr.catch) pr.catch(function () {});
        }
        resumeBackground = false;
    }

    function show(url, type) {
        hide();
        var token = generation;
        var el = layer();
        el.innerHTML = "";
        var media = document.createElement(type === "video" ? "video" : "img");
        el.setAttribute("data-src", url);
        function reveal() {
            if (token !== generation || el.firstElementChild !== media) return;
            var bg = document.querySelector("video.video-background");
            resumeBackground = !!(bg && (!bg.paused || bg.autoplay));
            if (resumeBackground) bg.pause();
            el.classList.add("on");
        }
        media.addEventListener("error", function () {
            if (token === generation) hide();
        });
        if (type === "video") {
            media.muted = true;
            media.loop = true;
            media.playsInline = true;
            media.preload = "none";
            media.addEventListener("playing", reveal, { once: true });
        } else {
            media.alt = "";
            media.addEventListener("load", reveal, { once: true });
        }
        el.appendChild(media);
        media.src = url;
        if (type === "video") {
            var pr = media.play();
            if (pr && pr.catch) pr.catch(function () {
                if (token === generation) hide();
            });
        }
    }

    document.querySelectorAll(".tool-card[data-preview]").forEach(function (card) {
        card.addEventListener("mouseenter", function () {
            show(card.getAttribute("data-preview"), card.getAttribute("data-preview-type") || "image");
        });
        card.addEventListener("mouseleave", hide);
    });

    /* link 工具(如龙语输入法)与主页面卡片共用同一预览层 */
    window.__hoverBg = { show: show, hide: hide };
})();
</script>
