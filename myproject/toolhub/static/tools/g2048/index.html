<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 · Dovahlore</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        margin: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; padding: 16px;
        background: radial-gradient(ellipse at 50% -20%, #131a26 0%, #0a0d13 60%) fixed, #0a0d13;
        color: #d8dee9;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none; -webkit-user-select: none;
    }
    header { display: flex; align-items: center; gap: 16px; width: min(92vw, 360px); }
    h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 2px;
         background: linear-gradient(135deg, #e8ecf3, #ffd98a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .scores { margin-left: auto; display: flex; gap: 8px; }
    .box { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
           border-radius: 10px; padding: 6px 12px; text-align: center; font-size: 11px; color: #7d8899; }
    .box b { display: block; font-size: 18px; color: #e8ecf3; font-variant-numeric: tabular-nums; }
    #board {
        position: relative; width: min(92vw, 360px); height: min(92vw, 360px);
        background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
        border-radius: 14px; touch-action: none;
    }
    .bg { position: absolute; background: rgba(255,255,255,.05); border-radius: 8px; }
    .tile {
        position: absolute; display: flex; align-items: center; justify-content: center;
        border-radius: 8px; font-weight: 700; font-variant-numeric: tabular-nums;
        transition: left .12s ease, top .12s ease;
        box-shadow: 0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .tile.new { animation: pop .18s ease; }
    .tile.merged { animation: bump .22s ease; }
    @keyframes pop { from { transform: scale(.3); opacity: .2; } to { transform: scale(1); opacity: 1; } }
    @keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .v2 { background: #3a4356; color: #cfd8e6; } .v4 { background: #46536b; color: #d5dce8; }
    .v8 { background: #5a6f96; color: #e4eaf4; } .v16 { background: #6d84ad; color: #eef2f8; }
    .v32 { background: #7f97c2; color: #f4f7fb; } .v64 { background: #93a9d6; color: #ffffff; }
    .v128 { background: #a9bede; color: #10151f; } .v256 { background: #bfd2e7; color: #10151f; }
    .v512 { background: #d5e4f0; color: #10151f; } .v1024 { background: #e6eff8; color: #10151f; }
    .v2048 { background: linear-gradient(135deg, #ffd98a, #e8a95c); color: #241a05; }
    .vsup { background: linear-gradient(135deg, #efc26b, #d98e3a); color: #241a05; }
    .tip { font-size: 12px; color: #7d8899; letter-spacing: .5px; }
    .btn {
        border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #d8dee9;
        border-radius: 999px; padding: 8px 20px; font-size: 14px; cursor: pointer; transition: all .2s ease;
        font-family: inherit;
    }
    .btn:hover { background: rgba(255,255,255,.12); color: #fff; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-ai { border-color: rgba(232,169,92,.5); color: #ffd98a; }
    .ai-comment { width: min(92vw, 360px); background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 12px 14px; }
    .ai-think { font-size: 12px; color: #5c6675; white-space: pre-wrap; margin-bottom: 6px;
        max-height: 96px; overflow-y: auto; }
    .ai-text { font-size: 14px; color: #e4d5b8; line-height: 1.7; white-space: pre-wrap; min-height: 20px; }
    #overlay {
        position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: rgba(8, 10, 15, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #overlay[hidden] { display: none; }
    .over-text { font-size: 22px; letter-spacing: 4px; color: #e8ecf3; }
    .over-score { font-size: 15px; color: #9aa7b8; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 12px; }
</style>
</head>
<body>
<header>
    <h1>2048</h1>
    <div class="scores">
        <div class="box">得分<b id="score">0</b></div>
        <div class="box">最佳<b id="best">0</b></div>
    </div>
</header>
<div id="board"></div>
<div class="tip">方向键 / WASD / 滑动 · 相同数字合并</div>
<button class="btn" id="restart">重新开始</button>
<div class="ai-comment" id="ai-comment" hidden>
    <div class="ai-think" id="ai-think"></div>
    <div class="ai-text" id="ai-text"></div>
</div>
<div id="overlay" hidden>
    <div class="over-text">本局结束</div>
    <div class="over-score" id="over-score"></div>
    <div class="row">
        <button class="btn" id="again">再来一局</button>
        <button class="btn btn-ai" id="ai-btn">🐉 AI 点评</button>
    </div>
</div>
<script src="../_common/ai.js"></script>
<script>
(function () {
    "use strict";
    var SIZE = 4, board = document.getElementById("board");
    var scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
    var overlay = document.getElementById("overlay"), overScore = document.getElementById("over-score");
    var aiBox = document.getElementById("ai-comment"), aiThink = document.getElementById("ai-think"), aiText = document.getElementById("ai-text");
    var grid, score, best, over;

    best = parseInt(localStorage.getItem("g2048_best") || "0", 10) || 0;
    bestEl.textContent = best;

    function zeros() { var g = []; for (var r = 0; r < SIZE; r++) { g.push([0, 0, 0, 0]); } return g; }
    function emptyCells() {
        var out = [];
        for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (!grid[r][c]) out.push([r, c]);
        return out;
    }
    function addRandom() {
        var cells = emptyCells(); if (!cells.length) return null;
        var cell = cells[Math.floor(Math.random() * cells.length)];
        grid[cell[0]][cell[1]] = Math.random() < 0.9 ? 2 : 4;
        return cell;
    }
    function slideRow(row) {
        var arr = row.filter(function (v) { return v; }), out = [], gained = 0, i;
        for (i = 0; i < arr.length; i++) {
            if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
                var v = arr[i] * 2; out.push(v); gained += v; i++;
            } else out.push(arr[i]);
        }
        while (out.length < SIZE) out.push(0);
        return { row: out, gained: gained };
    }
    function rev(a) { return a.slice().reverse(); }
    function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
    function col(c) { var out = []; for (var r = 0; r < SIZE; r++) out.push(grid[r][c]); return out; }
    function setCol(c, arr) { for (var r = 0; r < SIZE; r++) grid[r][c] = arr[r]; }

    function move(dir) {
        if (over) return;
        var prev = grid.map(function (row) { return row.slice(); });
        var moved = false, gained = 0, res;
        if (dir === "left" || dir === "right") {
            for (var r = 0; r < SIZE; r++) {
                var rw = dir === "left" ? grid[r].slice() : rev(grid[r]);
                res = slideRow(rw);
                var target = dir === "left" ? res.row : rev(res.row);
                if (!same(target, grid[r])) moved = true;
                gained += res.gained; grid[r] = target;
            }
        }
        if (dir === "up" || dir === "down") {
            for (var c = 0; c < SIZE; c++) {
                var cc = dir === "up" ? col(c) : rev(col(c));
                res = slideRow(cc);
                var target = dir === "up" ? res.row : rev(res.row);
                if (!same(target, col(c))) moved = true;
                gained += res.gained; setCol(c, target);
            }
        }
        if (!moved) return;
        var born = addRandom();
        score += gained;
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem("g2048_best", String(best)); }
        scoreEl.textContent = score;
        render(prev, born);
        if (!emptyCells().length && !canMove()) endGame();
    }
    function canMove() {
        for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
            if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
            if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
        }
        return false;
    }
    function cellPos(i) {
        var gap = 10, cs = (board.clientWidth - gap * (SIZE + 1)) / SIZE;
        return { off: gap + i * (cs + gap), size: cs };
    }
    function render(prev, born) {
        board.querySelectorAll(".bg,.tile").forEach(function (el) { el.remove(); });
        for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
            var bg = document.createElement("div"); bg.className = "bg";
            var p0 = cellPos(c), p1 = cellPos(r);
            bg.style.left = p0.off + "px"; bg.style.top = p1.off + "px";
            bg.style.width = p0.size + "px"; bg.style.height = p0.size + "px";
            board.appendChild(bg);
        }
        for (var r2 = 0; r2 < SIZE; r2++) for (var c2 = 0; c2 < SIZE; c2++) {
            var v = grid[r2][c2]; if (!v) continue;
            var t = document.createElement("div");
            var cls = v <= 2048 ? "v" + v : "vsup";
            t.className = "tile " + cls;
            if (born && born[0] === r2 && born[1] === c2) t.className += " new";
            else if (prev && prev[r2][c2] && prev[r2][c2] < v) t.className += " merged";
            t.textContent = v;
            var px = cellPos(c2), py = cellPos(r2);
            t.style.left = px.off + "px"; t.style.top = py.off + "px";
            t.style.width = px.size + "px"; t.style.height = py.size + "px";
            t.style.fontSize = (v >= 1024 ? px.size * 0.3 : v >= 128 ? px.size * 0.38 : px.size * 0.44) + "px";
            board.appendChild(t);
        }
    }
    function endGame() {
        over = true;
        var mx = 0; grid.forEach(function (row) { row.forEach(function (v) { if (v > mx) mx = v; }); });
        overScore.textContent = "得分 " + score + " · 最大 " + mx;
        overlay.hidden = false;
    }
    function init() {
        grid = zeros(); score = 0; over = false;
        scoreEl.textContent = "0";
        overlay.hidden = true; aiBox.hidden = true; aiText.textContent = ""; aiThink.textContent = "";
        addRandom(); addRandom(); render(null, null);
    }

    document.addEventListener("keydown", function (e) {
        var map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
                    a: "left", d: "right", w: "up", s: "down", A: "left", D: "right", W: "up", S: "down" };
        var dir = map[e.key];
        if (!dir) return;
        e.preventDefault(); move(dir);
    });
    var touch = null;
    board.addEventListener("touchstart", function (e) { touch = e.touches[0]; }, { passive: true });
    board.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    board.addEventListener("touchend", function (e) {
        if (!touch) return;
        var dx = e.changedTouches[0].clientX - touch.clientX, dy = e.changedTouches[0].clientY - touch.clientY;
        touch = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    });
    window.addEventListener("resize", function () { render(null, null); });
    document.getElementById("restart").addEventListener("click", init);
    document.getElementById("again").addEventListener("click", init);

    var aiBtn = document.getElementById("ai-btn");
    if (!window.ToolHubAI) aiBtn.hidden = true;
    aiBtn.addEventListener("click", function () {
        var mx = 0; grid.forEach(function (row) { row.forEach(function (v) { if (v > mx) mx = v; }); });
        aiBtn.disabled = true; aiBox.hidden = false;
        aiThink.textContent = ""; aiText.textContent = "…";
        var acc = "";
        window.ToolHubAI.askStream(
            "本局 2048 结束：得分 " + score + "，合成的最大数字是 " + mx + "。请点评。",
            function (chunk) {
                acc += chunk;
                var i = acc.indexOf("</think>");
                if (i >= 0) {
                    aiThink.textContent = acc.slice(0, i).replace(/<\/?think>/g, "").trim();
                    aiText.textContent = acc.slice(i + 8).trim();
                } else if (acc.indexOf("<think>") >= 0) {
                    aiThink.textContent = acc.replace(/<think>/g, "").trim();
                    aiText.textContent = "…";
                } else {
                    aiText.textContent = acc.trim();
                }
            }
        ).catch(function (err) { aiText.textContent = "AI 点评失败：" + err.message; })
         .then(function () { aiBtn.disabled = false; });
    });

    init();
})();
</script>
</body>
</html>
