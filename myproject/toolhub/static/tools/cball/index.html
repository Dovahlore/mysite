<title>连锁弹珠</title>
<!--
  连锁弹珠 ChainBreaker —— 开发态（多文件：本壳 + css/ + js/ 模块，按序加载）
  模块顺序即依赖顺序，不可调换：head(常量/工具) → audio → state(全局状态/行生成) → cards(卡池)
    → balls(弹体物理/碰撞) → fuse_tree(融合/技能树) → round_boss(回合/BOSS) → render(绘制)
    → shop_picking(工坊/选卡 UI) → input(输入) → main(主循环/CB 调试 API)
  交付态单文件：node build.js 把本壳的所有外联 css/js 原位内联成 ../连锁弹珠.html（图鉴子页 codex.html → ../连锁弹珠-图鉴.html）
  内嵌个人主页用法：
  <iframe src="连锁弹珠.html" style="width:min(480px,100%);aspect-ratio:2/3;border:0;border-radius:12px;" allow="autoplay" title="连锁弹珠"></iframe>

<body>
<h1 style="position:absolute;left:-9999px;top:0;">连锁弹珠</h1>

<script>"use strict";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const ERRS = [];
window.addEventListener('error', e => { ERRS.push(String(e.message || e)); });
window.addEventListener('unhandledrejection', e => { ERRS.push('rej:' + String((e.reason && e.reason.message) || e.reason)); });

/* ---------- 常量 ---------- */
const W = 480, H = 720;
const TOP = 56, DANGER_Y = 686;
const COLS = 8, CELL = 60, BW = 54, BH = 30, ROWH = 38, GRID_TOP = 64, BAND_H = 64;
// 2026-11-10 距离标准单位：1 格 = CELL（60px，一格方块位）。全场范围/半径统一以「格」表述——卡面/图鉴/名词表与代码经 cells() 同源换算（原 px 数值玩家不可读，且 60-90px 中心距在随机落位+块间留隙下常够不到邻块，本批波及类统一 2 格起）
function cells(u) { return u * CELL; }
const CANNON_Y = H - 66, BUCKET_W = 92; // 2026-11-09 六批拍板：炮塔整体上移 42px——不再遮住底部经验条（文字 ~671-679、条 682-688；炮塔底缘 ≤669）；出膛/接物/僚机全部随 CANNON_Y 联动
const BR = 6, BSPEED = 540, PELLET_SPEED = 640;
const AIM_MIN = 0.18;
const F_DISP = '"Arial Black","PingFang SC","Microsoft YaHei",sans-serif';
const F_UI = '"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
const F_MONO = '"Consolas","SF Mono","Menlo",monospace';
const ACCENT = '#00e5ff', DANGER = '#ff2e88', GOOD = '#00ff9d', WARN = '#ffe14d', BOMB = '#ff7a1a', SPLITC = '#c875ff';
const NEON_M = '#ff2bd6', NEON_Y = '#f7ff5e'; // V4.3 赛博朋克补充色
const GEM_HUES = [158, 192, 262, 316, 42];
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
// V4.19 关卡：五大主题场景（每 10 波切换，循环轮换）——烈焰山/毒沼泽/冰峰/雷暴/风林；主题背景特效 + 元素暂时 +1；风林=侧风影响弹道
const STAGES = [
  { name: '烈焰山', bg: '#1c0d08', star: '255,150,80', mod: { lab: '烈焰山 · 火属性 +1', elem: 'fire', elemN: 1, theme: 'fire' } },
  { name: '毒沼泽', bg: '#0c1810', star: '140,235,160', mod: { lab: '毒沼泽 · 毒属性 +1', elem: 'poison', elemN: 1, theme: 'swamp' } },
  { name: '冰峰', bg: '#0a1424', star: '185,225,255', mod: { lab: '冰峰 · 冰属性 +1', elem: 'ice', elemN: 1, theme: 'ice' } },
  { name: '雷暴', bg: '#131022', star: '205,185,255', mod: { lab: '雷暴 · 雷属性 +1 · 每波落雷 ×3', elem: 'bolt', elemN: 1, strikes: 3, theme: 'storm' } },
  { name: '风林', bg: '#101a0c', star: '190,255,170', mod: { lab: '风林 · 侧风影响弹道', wind: true, theme: 'wind' } }
];
function stageMod() { return (STAGES[stageIdx()] || {}).mod || null; } // V4.3 关卡特效
function hexToRgb(hx) {
  return [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)];
}

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const TAU = Math.PI * 2;

/* ---------- 合成音效 ---------- */
let ac = null, mgain = null, lastTick = 0, lastHeat = 0, lastCrit = 0, lastFrz = 0; // 2026-11-10：heat/crit/freeze 节流时钟（tick 同模式）
function ensureAudio() {
  if (S.muted) return;
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      mgain = ac.createGain(); mgain.gain.value = 0.4;
      const comp = ac.createDynamicsCompressor();
      mgain.connect(comp); comp.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function beep(f, d, type, v, slide, delay) {
  if (!ac || S.muted) return;
  try {
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + d);
    o.connect(g); g.connect(mgain);
    o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
function noiseS(d, v, fq, delay) {
  if (!ac || S.muted) return;
  try {
    const t0 = ac.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(d * ac.sampleRate));
    const buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq || 1200;
    const g = ac.createGain();
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + d);
    src.connect(f); f.connect(g); g.connect(mgain);
    src.start(t0);
  } catch (e) {}
}
const PENT = [0, 3, 5, 7, 10, 12, 15, 17, 19];
const sfx = {
  shoot()  { noiseS(0.07, 0.16, 900); beep(320, 0.1, 'square', 0.09, -140); },
  launch() { beep(680, 0.05, 'square', 0.07, -260); },
  tick()   { if (gameT - lastTick < 0.03) return; lastTick = gameT; beep(560, 0.03, 'sine', 0.04); },
  hit(c)   { const st = PENT[Math.min(c, PENT.length - 1)]; beep(440 * Math.pow(2, st / 12), 0.07, 'triangle', 0.13); },
  destroy(c){ const st = PENT[Math.min(c, PENT.length - 1)]; beep(523 * Math.pow(2, st / 12), 0.1, 'square', 0.11); noiseS(0.05, 0.09, 2600); },
  boom()   { noiseS(0.38, 0.5, 700); beep(95, 0.32, 'sine', 0.4, -45); },
  chain(i) { beep(660 * Math.pow(2, i * 2 / 12), 0.12, 'sine', 0.13, 0, i * 0.07); },
  pick()   { beep(660, 0.09, 'sine', 0.15); beep(990, 0.12, 'sine', 0.15, 0, 0.08); },
  split()  { beep(480, 0.09, 'sawtooth', 0.09, 320); },
  zap()    { beep(1300, 0.09, 'square', 0.11, -750); noiseS(0.05, 0.08, 5000); },
  boing()  { beep(240, 0.14, 'sine', 0.14, 320); },
  alarm()  { beep(170, 0.3, 'sawtooth', 0.22, -55); noiseS(0.2, 0.18, 420); },
  over()   { [392, 311, 247, 165].forEach((f, i) => beep(f, 0.3, 'triangle', 0.2, 0, i * 0.17)); },
  record() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, 'sine', 0.16, 0, i * 0.1)); },
  /* 2026-11-10 事件音效批：热冲击/落雷/暴击/冻结/激光光柱/毒云（heat/crit/freeze 带 tick 式节流，防同帧连环触发刷屏） */
  heat()   { if (gameT - lastHeat < 0.05) return; lastHeat = gameT; noiseS(0.16, 0.17, 6500); beep(200, 0.13, 'sine', 0.1, -110); }, // 热冲击：蒸汽嘶 + 低嚟
  strike() { noiseS(0.09, 0.2, 8000); beep(1500, 0.1, 'square', 0.09, -1150); noiseS(0.5, 0.3, 210, 0.03); }, // 落雷：脆响 + 远雷滚
  crit()   { if (gameT - lastCrit < 0.05) return; lastCrit = gameT; beep(1560, 0.07, 'square', 0.12); beep(2090, 0.09, 'sine', 0.1, 0, 0.035); }, // 暴击：亮金双音
  freeze() { if (gameT - lastFrz < 0.06) return; lastFrz = gameT; beep(1720, 0.09, 'sine', 0.1, -420); beep(1140, 0.12, 'triangle', 0.08, -260, 0.05); noiseS(0.07, 0.045, 6000, 0.02); }, // 冻结：冰晶下行双音 + 细闪
  laser()  { beep(920, 0.12, 'sawtooth', 0.07, 460); noiseS(0.05, 0.045, 7000); }, // 激光光柱：缴齿上扫 + 高频嘶
  cloud()  { noiseS(0.3, 0.09, 480); beep(110, 0.22, 'sine', 0.07, 55); } // 毒云：沼泡 + 毒嘶
};

/* ---------- 2026-11-10 关卡背景音：按主题的轻环境声（BGM 另行预留——用户找曲后再接） ---------- */
let ambT = 0, ambNext = 2.5;
const AMB = {
  fire()  { noiseS(rnd(0.5, 0.9), 0.05, 240); if (Math.random() < 0.4) noiseS(0.06, 0.045, 3200, rnd(0.15, 0.55)); }, // 烈焰山：地底闷燃 + 偶发爆花
  swamp() { beep(rnd(85, 135), rnd(0.25, 0.4), 'sine', 0.045, rnd(30, 80)); noiseS(rnd(0.4, 0.7), 0.025, 500, 0.1); }, // 毒沼泽：沼泡上冒 + 毒嘶
  ice()   { beep(rnd(1400, 2100), rnd(0.9, 1.4), 'sine', 0.028); noiseS(rnd(0.8, 1.2), 0.02, 900); }, // 冰峰：高空冰晶泛音 + 风嘶
  storm() { noiseS(rnd(0.7, 1.1), 0.06, 160); }, // 雷暴：远处闷雷滚
  wind()  { noiseS(rnd(1.0, 1.6), 0.045, 700); } // 风林：阵风过林
};
function stageAmbience(rdt) { // 主循环 play 分支每帧喂 rdt；无 AudioContext/静音时零开销直跳（选卡/工坊期间照常播）
  if (!ac || S.muted) return;
  ambT += rdt;
  if (ambT < ambNext) return;
  ambT = 0; ambNext = rnd(2.2, 4.6);
  const fn = AMB[(stageMod() || {}).theme];
  if (fn) { try { fn(); } catch (e) {} }
}

/* ---------- 状态 ---------- */
let gameT = 0;
function freshUp() {
  // 升级卡计数键：已删卡键保留恒 0（逻辑自然停用）；V3 新增：元素联动 syn×13、爆炸三件套 expIgnite/cluster、光暗 lightamp/darkdeep、金蛋落雷/毒染、护盾上限 shieldv；R2fireice 2026-11-04 火冰波：frostext/deepwinter/frostburst 三卡已删（冻结永久后失去意义），键保留恒 0
  return { atk: 0, arsenalLv: 0, shot: 0, shotLv: 0, bomb: 0, burn: 0, bolt: 0, boltdmg: 0, spd: 0, xpmult: 0, xpLv: 0, critdmg: 0, shieldpen: 0, supply: 0, fuse: 0, linger: 0, crit: 0, execute: 0, antirm: 0, antirmSR: 0, comboeng: 0, splitbias: 0, supply2: 0, doubleload: 0, refill: 0, gemshock: 0, absorb: 0, volleyproto: 0, spreader: 0, thorns: 0, compoud: 0, autobarrage: 0, execfield: 0, magdouble: 0, phaseshield: 0, bosshunter: 0, gemres: 0, rainbow: 0, dualbroad: 0, phoenix: 0, endless: 0, timelord: 0, gravitywell: 0, prism: 0, fusionload: 0, fusionpact: 0, fusionSize: 0, resonance: 0, effectres: 0, goldeng: 0, turret: 0, hunt: 0, entropy: 0, defprotocol: 0, overclock: 0, dropres: 0, rebound: 0, expamp: 0, burnamp: 0, boltamp: 0, virus: 0, leech: 0, leechfeed: 0, bloodhunt: 0, markcard: 0, thor1: 0, thorT: 0, thor2: 0, railbolt: 0, winterammo: 0, frailshot: 0, deepwinter: 0, burnlen: 0, burnrate: 0, paracap: 0, frostext: 0, // 2026-11-03 疫病波：burncap 键随双重燃烧卡删除（燃烧无上限）
    synFI: 0, synICS: 0, synBF: 0, synFP: 0, synPB: 0, synIB: 0, synBBL: 0, synIP: 0, synFB: 0, synBP: 0, synLD: 0, synLI: 0, synDP: 0, expIgnite: 0, cluster: 0, lightamp: 0, frostburst: 0, frzblast: 0, goldstrike: 0, goldpoison: 0, shieldv: 0, potionFrz: 0, reroll: 0, cloud: 0, cloud2: 0, synP1: 0, synL1: 0, synS1: 0, synD1: 0, sun2: 0, ghost2: 0, rail2: 0, swarm2: 0, meteor2: 0, frostneed: 0, darkecho: 0, shotN: 0, weakaim: 0 }; // R2dark 2026-11-04：darkdeep 键随暗蚀深化删卡移除；darkecho=湮灭回响（斩杀线击杀回盾/层）；R2misc 2026-11-04：新增 shotN=散弹多头 +1丸/层、weakaim=弱点瞄准 +10%暴击/层
}
// 护盾上限（2026-11-02 批注）：基础 4；应急护盾 +1/层、相位护盾 +1；合计封顶 8
function shieldCap() { return Math.min(8, 4 + (S.up.shieldv || 0) + (S.up.phaseshield > 0 ? 1 : 0)); }
function buffOn(id) { return S.buffs.some(bf => bf.id === id); }
function addBuff(id, t) {
  const ex = S.buffs.find(bf => bf.id === id);
  if (ex) ex.t = Math.max(ex.t, t); else S.buffs.push({ id, t });
}
function removeBuff(id) { S.buffs = S.buffs.filter(bf => bf.id !== id); }
function dropChance() {
  // 击碎掉落率：8% 基础，幸运潮期间 ×2，幸运每点 +15%（幸运卡+光属性），掉宝共振 +25%
  // 2026-11-04 幸运星独占：幸运星层数（S.luck，光属性不吃）额外独立乘区 +2%/层
  let ch = 0.08;
  if (buffOn('luckysurge')) ch *= 2;
  ch *= (1 + 0.15 * luckVal()) * (1 + 0.02 * (S.luck || 0));
  return ch * (S.up.dropres > 0 ? 1.25 : 1);
}
// 2026-11-06 风林增强：侧风 130–210 px/s（原 60–110，弹道弯曲明显加大）；每波重掷方向与风力
function rollWindX() { return (Math.random() < 0.5 ? -1 : 1) * rnd(130, 210); }
const S = {
  mode: 'menu', paused: false, muted: false,
  score: 0, disp: 0, best: 0, newBest: false, wave: 1, arsenal: 5, shield: 3,
  combo: 0, comboT: 0, comboPop: 0, maxCombo: 0,
  blocks: [], balls: [], pickups: [], parts: [], floats: [], shocks: [], bolts: [], beams: [], evts: [], launchQ: [], rays: [], bees: [], clouds: [], zones: [], holes: [], // 2026-11-03 疫病波：zones=坏死区域；2026-11-04 黑洞引力场：holes=湮灭黑洞存续实体；2026-11-10：beams=激光光柱实体（与闪电链 bolts 分离）
  perm: { fire: 0, ice: 0, bolt: 0, poison: 0, blood: 0, pierce: 0, split: 0, shot: 0 }, // V3 基础球 8：元素 5 + 机能 3
  gemGroups: new Map(), gemSeq: 0, blkSeq: 0,
  luck: 0, pity: { sr: 0, ssr: 0 }, buffs: [], phoenixUsed: false, waveScore0: 0, killCount: 0, fuse: {}, tree: {}, shop: false,
  elem: { fire: 0, ice: 0, bolt: 0, poison: 0, blood: 0, light: 0, dark: 0 }, // V3 元素等级（元素精粹卡）
  lightHits: 0, hadGold: false, // V3：圣愈计数 / 金弹史标记（金弹工程门）
  railCharge: 0, railKillDmg: 0, railVolleyKill: false, // Wave4·洒灭强化：每齐射弹速充能 / 到顶后每杀固定伤
  lastHitKind: null, splitExtra: 0, sunFirst: false,
  volley: false, canFire: true, aimOn: false, aimA: -Math.PI / 2,
  mouse: { x: -999, y: -999 }, // V4.2：悬浮提示用（方块 debuff tooltip）
  pausePage: null, pauseScroll: 0, // V4.4：暂停图鉴中心页签
  pauseT: 0, pauseSel: null, pauseFilter: 'all', // 2026-11-04 暂停图鉴改版：暂停专用时钟（hover/脉冲动画）、卡牌详情固定选中、技能图鉴筛选
  volleyT: 0, hint: 0, overT: 0, menuT: 0,
  ts: 1, slow: 0, shake: 0, flash: 0, redFlash: 0, bgCur: [10, 14, 26], lastStage: 0, muzzle: 0, splitCount: 0, windX: 0, boltT: 2, boltFlash: 0, boltPath: null, // V4.19 风林侧风/雷暴闪电
  stars: [], ambient: [], shootT: 5, streak: null,
  up: freshUp(), level: 1, xp: 0, levelQ: [], picking: null,
  char: null, menuPage: 'title', menuSel: 0, ever: {}, // V4：当前炮塔 / 菜单页；V4.7 everOwned：曾拥有过的球种（永久解锁标记）
};
try { S.best = parseInt(localStorage.getItem('chainbreaker_best_v1') || '0', 10) || 0; } catch (e) {}
for (let i = 0; i < 70; i++) S.stars.push({ x: Math.random() * W, y: Math.random() * H, z: rnd(0.3, 1), tw: Math.random() * TAU });
const stageIdx = () => Math.floor((S.wave - 1) / 10) % STAGES.length;
// V4.19 环境粒子：随主题场景变化（烈焰山火星/毒沼泽毒泡/冰峰暴雪/雷暴雨丝/风林落叶）
function respawnAmbient(p, spread) {
  const si = stageIdx();
  p.theme = ((STAGES[si] || {}).mod || {}).theme || 'none';
  p.a = rnd(0.5, 1); p.ph = Math.random() * TAU;
  if (p.theme === 'fire') { p.r = rnd(1.5, 3); p.x = Math.random() * W; p.y = spread ? Math.random() * H : H + rnd(4, 30); p.vx = rnd(-9, 9); p.vy = -rnd(22, 48); }
  else if (p.theme === 'swamp') { p.r = rnd(2, 5); p.x = Math.random() * W; p.y = spread ? Math.random() * H : H + rnd(4, 30); p.vx = rnd(-4, 4); p.vy = -rnd(8, 18); }
  else if (p.theme === 'ice') { p.r = rnd(1, 2.6); p.x = spread ? Math.random() * W : -rnd(0, 40); p.y = spread ? Math.random() * H : -rnd(4, 30); p.vx = rnd(15, 40); p.vy = rnd(40, 90); }
  else if (p.theme === 'storm') { p.r = rnd(6, 12); p.x = Math.random() * W; p.y = spread ? Math.random() * H : -rnd(10, 60); p.vx = rnd(10, 30); p.vy = rnd(380, 560); }
  else if (p.theme === 'wind') { const wd = (S.windX || 0) >= 0 ? 1 : -1; p.r = rnd(2.5, 5); p.x = spread ? Math.random() * W : (wd > 0 ? -rnd(4, 40) : W + rnd(4, 40)); p.y = -rnd(4, 30); p.vx = wd * rnd(30, 70); p.vy = rnd(8, 26); }
  else { p.r = rnd(1.5, 3); p.x = Math.random() * W; p.y = Math.random() * H; p.vx = rnd(-5, 5); p.vy = rnd(-5, 5); }
}
for (let i = 0; i < 18; i++) { const p = {}; respawnAmbient(p, true); S.ambient.push(p); }
function updateAmbient(rdt) {
  for (const st of S.stars) { st.y += 6 * st.z * rdt; st.tw += rdt * 2; if (st.y > H) { st.y = -2; st.x = Math.random() * W; } }
  for (const p of S.ambient) {
    p.x += p.vx * rdt; p.y += p.vy * rdt; p.ph += rdt;
    if (p.theme === 'fire') p.x += Math.sin(p.ph * 1.7) * 12 * rdt; // 火星飘摆

  }

  const stmA = stageMod();
  if (stmA && stmA.theme === 'storm') {
    S.boltT -= rdt;
    if (S.boltT <= 0) {
      S.boltT = rnd(1.6, 4.6); S.boltFlash = 0.55;
      let cx = rnd(W * 0.15, W * 0.85), cy = 0;
      const pts = [[cx, cy]];
      for (let i = 0; i < 7; i++) { cy += rnd(30, 70); cx += rnd(-46, 46); pts.push([cx, Math.min(cy, H * 0.55)]); }
      S.boltPath = pts;
    }
    if (S.boltFlash > 0) S.boltFlash = Math.max(0, S.boltFlash - rdt * 1.6);
  } else if (S.boltFlash > 0) { S.boltFlash = Math.max(0, S.boltFlash - rdt * 1.6); }
  S.shootT -= rdt;
  if (S.shootT <= 0) {
    S.shootT = rnd(5, 11);
    const dir = Math.random() < 0.5 ? 1 : -1;
    S.streak = { x: dir > 0 ? -20 : W + 20, y: rnd(TOP + 20, H * 0.4), vx: dir * rnd(260, 380), vy: rnd(60, 120), life: 1 };
  }
  if (S.streak) {
    const sm = S.streak;
    sm.x += sm.vx * rdt; sm.y += sm.vy * rdt; sm.life -= rdt * 0.55;
    if (sm.life <= 0 || sm.x < -60 || sm.x > W + 60) S.streak = null;

}

/* ---------- 画布适配 ---------- */
function fit() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.985;
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
}
window.addEventListener('resize', fit);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shapesOverlap(a, b) {
  // 精确几何判定：圆-圆按圆心距，圆-矩形按矩形最近点，矩形-矩形按 AABB（均留边距）
  const ca = a.shape === 'circle', cb = b.shape === 'circle';
  if (ca && cb) {
    const dx = (a.x + a.w / 2) - (b.x + b.w / 2), dy = (a.y + a.h / 2) - (b.y + b.h / 2);
    const rr = (a.w + b.w) / 2 + 4;
    return dx * dx + dy * dy < rr * rr;
  }
  if (ca || cb) {
    const c = ca ? a : b, rct = ca ? b : a;
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2, r = c.w / 2;
    const px = clamp(cx, rct.x, rct.x + rct.w), py = clamp(cy, rct.y, rct.y + rct.h);
    const dx = cx - px, dy = cy - py;
    return dx * dx + dy * dy < (r + 3) * (r + 3);
  }
  return a.x < b.x + b.w + 3 && a.x + a.w + 3 > b.x && a.y < b.y + b.h + 3 && a.y + a.h + 3 > b.y;
}
function tryDrift(b) {
  // 第 2 关起：普通块有概率变成左右缓慢漂移的移动块
  if (S.wave < 11 || b.boss || b.type !== 'n') return;
  if (Math.random() > 0.45) return;
  // 逐级缩小振幅直到放得下漂移走廊（拥挤时退化到 4px 微漂，保住移动块特性）
  for (const amp of [ri(16, 26), 16, 12, 8, 4]) {
    const ghost = { x: b.x - amp, y: b.y, w: b.w + amp * 2, h: b.h, shape: b.shape };
    let ok = true;
    for (const p of S.blocks) {
      if (p === b || p.dead) continue;
      if (p.y > b.y + b.h + 8 || p.y + p.h < b.y - 8) continue;
      const pg = p.driftA ? { x: p.driftX - p.driftA, y: p.y, w: p.w + p.driftA * 2, h: p.h, shape: p.shape } : p;
      if (shapesOverlap(ghost, pg)) { ok = false; break; }
    }
    if (ok) { b.driftX = b.x; b.driftA = amp; b.driftS = rnd(0.5, 1.1); b.driftP = Math.random() * TAU; return; }
  }
}
function hpBase(w) { return Math.max(1, Math.round(w)); } // 血量基准：波次即基准（2026-10-30 上调，原 w×2/3）；行内 35% +1 随机浮动保留
function spawnRowAt(y) {
  const wave = S.wave;
  const base = hpBase(wave) + (Math.random() < 0.35 ? 1 : 0);
  const placed = [];
  const fits = (nb) => {
    const gsp = 3; // 2026-11-09 拍板：块间留隙 ≥6px（原零隙相切，配合漂移振幅易视觉粘连/穿透后相交）
    const nb2 = { x: nb.x - gsp, y: nb.y - gsp, w: nb.w + gsp * 2, h: nb.h + gsp * 2, shape: nb.shape };
    for (const p of placed) {
      const pg = p.driftA ? { x: p.driftX - p.driftA, y: p.y, w: p.w + p.driftA * 2, h: p.h, shape: p.shape } : p;
      if (shapesOverlap(nb2, pg)) return false;
    }
    for (const p of S.blocks) {
      if (p.y >= y + BAND_H + 40) continue;
      const pg = p.driftA ? { x: p.driftX - p.driftA, y: p.y, w: p.w + p.driftA * 2, h: p.h, shape: p.shape } : p;
      if (shapesOverlap(nb2, pg)) return false;
    }
    return true;
  };
  const tryPlace = (spec, near) => {
    for (let i = 0; i < 26; i++) {
      let x, yy;
      if (near) {
        x = clamp(near.x + rnd(-72, 72), 4, W - 4 - spec.w);
        yy = clamp(near.y + rnd(-36, 36), y + 2, Math.max(y + 2, y + BAND_H - spec.h - 2));
      } else {

      const nb = Object.assign({ id: ++S.blkSeq, shape: 'rect', hp: base, maxHp: base, type: 'n', flash: 0, dead: false, gid: null, fuse: false, rot: 0, born: gameT, frozen: 0, frozenBonus: false }, spec, { x, y: yy });
      if (!fits(nb)) continue;
      S.blocks.push(nb); placed.push(nb);
      tryDrift(nb);
      return nb;
    }
    return null;
  };
  // 联动水晶：沿随机走向成串，共享血池（打一颗全串掉血，清零成串碎）
  if (wave >= 3 && Math.random() < 0.22) {
    const gid = 'g' + (++S.gemSeq);
    S.gemGroups.set(gid, { hue: GEM_HUES[ri(0, GEM_HUES.length - 1)], members: [], chaining: false, pulse: 0, pool: 0 });
    const len = ri(2, 4);

    for (let i = 0; i < len; i++) {

      if (!b) break;
      b.gid = gid;
      S.gemGroups.get(gid).members.push(b);
      prev = b;
    }
    const grp0 = S.gemGroups.get(gid);
    if (grp0.members.length < 2) {
      // 孤块不成串：撤掉，避免伪锁链
      for (const m of grp0.members) m.dead = true;

      const pool = Math.max(10, (base + 2) * grp0.members.length);

  const count = clamp(2 + Math.floor(wave / 6) + (Math.random() < 0.35 ? 1 : 0), 2, 5);

      const r = ri(18, 24);

    } else if (wave >= 6 && roll < 0.255) {

      const hp = hpBase(wave) * 2;
      if (Math.random() < 0.5) {
        const r = ri(19, 26);
        tryPlace({ type: 'r', shape: 'circle', w: r * 2, h: r * 2, hp, maxHp: hp });
      } else {
        tryPlace({ type: 'r', w: ri(62, 84), h: ri(30, 40), hp, maxHp: hp });
      }
    } else if (wave >= 12 && roll < 0.29) {
      // 幽灵块（后期）：每隔一回合灵体化，灵体期仅幽灵弹可伤（含太阳在内全部免疫）
      const hp = hpBase(wave) * 2;

    } else if (wave >= 8 && roll < 0.325) {
      // 护盾块：先击破盾才开始掉血，每回合回满盾
      const hp = base + 1;
      const sm = 3 + Math.floor(wave / 8);
      tryPlace({ type: 'd', w: ri(46, 60), h: ri(28, 36), hp, maxHp: hp, shieldMax: sm, shieldCur: sm });
    } else {
      const sr = Math.random();
      if (sr < 0.3) {
        // 三角砖：角度随机（增大更多）
        const R = ri(24, 34);
        tryPlace({ shape: 'tri', w: R * 2, h: R * 2, rot: Math.random() * TAU, hp: base, maxHp: base });
      } else if (sr < 0.6) {
        const r = ri(16, 29);
        const hp = base + Math.round((r - 16) / 7);
        tryPlace({ shape: 'circle', w: r * 2, h: r * 2, hp, maxHp: hp });
      } else {
        const w = ri(46, 76), h = ri(26, 38);
        const hp = base + Math.round((w - 46) / 16);
        tryPlace({ w, h, hp, maxHp: hp });
      }
    }
  }
  if (wave % 7 === 0) {
    // 要塞波：装甲块血量为基础 ×2 再 +4，不再封顶
    const hp = hpBase(wave) * 2 + 4;
    for (let k = 0; k < 3; k++) {
      const r = ri(21, 27);
      tryPlace({ type: 'r', shape: 'circle', w: r * 2, h: r * 2, hp, maxHp: hp });
    }
    addFloat(W / 2, 120, '要塞波 · 打穿装甲', WARN, 15);
  }
}

function updateBalls(dt) {

}

  if (deathStat(b, 'frailG') && treeOn('ghost', 'r1')) {

    for (const p of S.blocks) {
      if (p.dead || p === b) continue;
      const pad4 = (p.shape === 'circle' || p.shape === 'tri') ? p.w / 2 : Math.max(p.w, p.h) / 2;
      if (Math.hypot(p.x + p.w / 2 - cx, p.y + p.h / 2 - cy) <= cells(2) + pad4) applyFrost(p, fl);

  if (deathStat(b, 'frailG') && treeOn('ghost', 'ssr1')) {

      if (Math.hypot(p.x + p.w / 2 - cx, p.y + p.h / 2 - cy) <= cells(2)) { p.frail = 1; p.frailG = 1; }
    }
  }
}

function updateRays(dt) {

    const sdt = dt / steps;

      r.x += r.vx * sdt; r.y += r.vy * sdt;
      if (r.x < 3) { r.x = 3; r.vx = Math.abs(r.vx); }
      else if (r.x > W - 3) { r.x = W - 3; r.vx = -Math.abs(r.vx); }
      if (r.y < TOP + 3) { r.y = TOP + 3; r.vy = Math.abs(r.vy); }
      else if (r.y > H - 3) { r.y = H - 3; r.vy = -Math.abs(r.vy); } // 底墙照常折返（用户拍板：无限射程卡下光不该触底消失）

function step(rdt) {

  // 时间领主：连击 ≥8 时子弹时间（不高于 0.6×）

  updateAmbient(rdt);

  if (S.evts.length) {
    const due = [];
    for (const e of S.evts) { e.t -= dt; if (e.t <= 0) due.push(e); }
    if (due.length) { S.evts = S.evts.filter(e => e.t > 0); for (const e of due) e.fn(); }
  }
  if (S.launchQ.length) {
    for (const l of S.launchQ) l.t -= dt;

    if (ready.length) { S.launchQ = S.launchQ.filter(l => l.t > 0); for (const l of ready) spawnBall(l); }
  }
  updateBalls(dt);
  S.balls = S.balls.filter(b => !b.dead);
  updateRays(dt);
  updateBees(dt);
  updatePickups(dt);
  if (S.combo > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  S.comboPop = Math.max(0, S.comboPop - dt * 3);
  S.blocks = S.blocks.filter(b => !b.dead);
  for (const b of S.blocks) { b.flash = Math.max(0, b.flash - dt * 5); if (b.critT > 0) b.critT = Math.max(0, b.critT - dt); } // 2026-11-10 暴击震动计时衰减（纯视效，见 drawBlock）

    if (!b.dead && b.burn > 0 && !b.burnQ) b.burnQ = new Array(Math.max(1, b.burnL || 1)).fill(b.burn); // 兼容直构/旧状态：按剩余时长建队
    if (!b.dead && b.burnQ && b.burnQ.length) {
      for (let i = 0; i < b.burnQ.length; i++) b.burnQ[i] -= dt;
      b.burnQ = b.burnQ.filter(t => t > 0);
      b.burnL = b.burnQ.length;
      b.burn = b.burnL ? Math.max.apply(null, b.burnQ) : 0;
      b.burnTick -= dt;
      if (Math.random() < dt * 5) spark(b.x + rnd(4, Math.max(5, b.w - 4)), b.y + rnd(2, Math.max(3, b.h - 2)), '#ff9a4d');

  S.muzzle = Math.max(0, S.muzzle - rdt * 6);

  }
  S.shake = Math.max(0, S.shake - rdt * 26);
  S.flash = Math.max(0, S.flash - rdt * 1.5);
  S.redFlash = Math.max(0, S.redFlash - rdt * 1.1);
  S.disp += (S.score - S.disp) * Math.min(1, rdt * 10);
  for (const p of S.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const f of S.floats) { f.life -= dt * 1.1; f.y += f.vy * dt; }
  S.floats = S.floats.filter(f => f.life > 0);
  for (const s of S.shocks) s.t += dt * 3.2;
  S.shocks = S.shocks.filter(s => s.t < 1);
  for (const h of S.holes) h.t -= dt; // 2026-11-04 黑洞引力场：存续 1.2s 递减（力淡出口径见 updateBalls）
  S.holes = S.holes.filter(h => h.t > 0);
  for (const z of S.bolts) z.life -= dt;
  S.bolts = S.bolts.filter(z => z.life > 0);
  for (const bm of S.beams) bm.life -= dt; // 2026-11-10 激光光柱实体衰减（S.beams，与闪电链分离）
  S.beams = S.beams.filter(bm => bm.life > 0);
  if (S.hint > 0) S.hint -= rdt;
}

  [1, 128, 74, 58],
  [20, 212, 82, 58],
  [50, 276, 70, 62],
  [90, 32, 92, 56],
  [150, 6, 86, 56],
  [300, 50, 90, 58],

function hpColorOf(hp) {
  const h = Math.max(1, hp);

  if (h >= last[0]) return last;
  for (let i = 0; i < HP_STOPS.length - 1; i++) {
    const a = HP_STOPS[i], b2 = HP_STOPS[i + 1];
    if (h <= b2[0]) {
      const t = (Math.log(h) - Math.log(a[0])) / (Math.log(b2[0]) - Math.log(a[0]));
      return [0, Math.round(a[1] + (b2[1] - a[1]) * t), Math.round(a[2] + (b2[2] - a[2]) * t), +(a[3] + (b2[3] - a[3]) * t).toFixed(1)];

}
function bodyDark(type, hp, hue) {

function drawBlockBody(x, y, w, h, type, hp, hue, fuse, shape, maxHp, rot) {

    else if (b.kind === 's') glow = SPLITC;
    else if (b.kind === 'frag') glow = '#b58cff'; // 分裂子弹（Wave4 独立弹种）：淡紫子珠

    else if (b.kind === 'p') glow = '#bfeeff';

    if (b.kind === 'melt') { // 热熔：越热越红、泛光越大（热度=已叠熔层/4，封顶）

    }
    // 特殊弹药视觉放大（纯外观，碰撞半径不变）：特殊弹 +3px、散弹丸 +1px、普通弹不变
    const vr = b.kind === 'n' ? b.r : (b.kind === 'p' ? b.r + 1 : b.r + 3);
    // 差异化尾迹（2026-11-09 三批）：血流坠落/火尾黑烟/寒气扩散/毒气上飘/暗影残雾；其余球种沿用主色光点尾
    const tn = b.trail.length;
    const tm = b.kind === 'blood' ? 'drip' : b.kind === 'fire' ? 'flame' : b.kind === 'ice' ? 'mist' : (b.kind === 'poison' || b.kind === 'plague') ? 'gas' : b.kind === 'dark' ? 'wisp' : 'orb';
    if (tm === 'orb') {

      for (let i = 0; i < tn; i++) { const t = b.trail[i]; ctx.globalAlpha = (i + 1) / tn * 0.3; ctx.beginPath(); ctx.arc(t.x, t.y, vr * 0.7 * (i / tn + 0.3), 0, TAU); ctx.fill(); }

      for (let i = 0; i < tn; i++) { const t = b.trail[i]; const k2 = (i + 1) / tn; ctx.globalAlpha = k2 * 0.5; ctx.fillStyle = i % 2 ? '#c11f30' : '#8f1420'; ctx.beginPath(); ctx.arc(t.x + Math.sin(i * 2.7 + gameT * 3) * 1.2, t.y + (tn - i) * 1.1, vr * (0.28 + k2 * 0.42), 0, TAU); ctx.fill(); }
    } else if (tm === 'flame') {

      for (let i = 0; i < tn; i++) { const t = b.trail[i]; const k2 = (i + 1) / tn; const smk = i % 3 === 2; ctx.globalAlpha = k2 * (smk ? 0.3 : 0.55); ctx.fillStyle = smk ? '#4a4550' : (i % 2 ? '#ff8c2e' : '#ffb35c'); ctx.beginPath(); ctx.arc(t.x + Math.sin(i * 1.9 + gameT * 11) * 1.6, t.y - (smk ? (tn - i) * 0.8 : 0), vr * (smk ? 0.52 : 0.34 + k2 * 0.4), 0, TAU); ctx.fill(); }
    } else if (tm === 'mist') {
      // 寒气尾：白蓝雾团尾后扩散变淡
      for (let i = 0; i < tn; i++) { const t = b.trail[i]; const k2 = (i + 1) / tn; ctx.globalAlpha = k2 * 0.26; ctx.fillStyle = '#cfeeff'; ctx.beginPath(); ctx.arc(t.x + Math.sin(i * 2.3 + gameT * 5) * 2, t.y, vr * (0.5 + (1 - k2) * 0.7), 0, TAU); ctx.fill(); }
    } else if (tm === 'gas') {
      // 毒气尾：毒泡上飘消散（疫病球黄绿）
      for (let i = 0; i < tn; i++) { const t = b.trail[i]; const k2 = (i + 1) / tn; ctx.globalAlpha = k2 * 0.4; ctx.fillStyle = b.kind === 'plague' ? '#b9e24a' : '#63e07e'; ctx.beginPath(); ctx.arc(t.x + Math.sin(i * 2.1 + gameT * 6) * 1.5, t.y - (tn - i) * 0.9, vr * (0.24 + k2 * 0.4), 0, TAU); ctx.fill(); }
    } else {
      // 暗影残雾：紫黑交替碎雾扭动
      for (let i = 0; i < tn; i++) { const t = b.trail[i]; const k2 = (i + 1) / tn; ctx.globalAlpha = k2 * (i % 2 ? 0.42 : 0.2); ctx.fillStyle = i % 2 ? '#8a5cf0' : '#3c2a66'; ctx.beginPath(); ctx.arc(t.x, t.y + Math.sin(i * 3 + gameT * 4) * 1.2, vr * (0.3 + k2 * 0.45), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    else { ctx.shadowColor = glow; ctx.shadowBlur = b.kind === 'n' ? 0 : 14; }
    // 球体本体：主色 + 左上高光点（原白芯退役；幽灵弹半透明）
    if (b.kind === 'ghost') ctx.globalAlpha = 0.72;
    ctx.fillStyle = bMain;

    ctx.globalAlpha = 1;
    ctx.fillStyle = body[1];
    ctx.beginPath(); ctx.arc(b.x - vr * 0.32, b.y - vr * 0.36, vr * 0.42, 0, TAU); ctx.fill();

    if (S.up.prism > 0 && b.age < 3) {

    // 树档位进化外观（纯视觉）：已点节点越多越华丽——3 点光环、6 点双环、8 点满树星芒

      ctx.fillStyle = '#ff7a1a';
      ctx.globalAlpha = 0.32;
      ctx.beginPath(); ctx.arc(b.x, b.y, vr * 1.75 * fl, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ffb066';
      ctx.beginPath(); ctx.arc(b.x, b.y, vr * 1.25 * (2 - fl), 0, TAU); ctx.fill();
      ctx.fillStyle = '#4a4550'; ctx.globalAlpha = 0.28;
      const smc = (gameT * 26) % 12;
      ctx.beginPath(); ctx.arc(b.x + Math.sin(gameT * 3) * 2, b.y - vr - smc, 2.4 + smc * 0.22, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - Math.sin(gameT * 2.4) * 2.4, b.y - vr * 0.4 - ((smc + 6) % 12), 2 + ((smc + 6) % 12) * 0.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff6d8'; ctx.globalAlpha = 0.9;

    } else if (b.kind === 'b') {

      ctx.save();
      ctx.strokeStyle = '#ff4545'; ctx.lineWidth = 2;

      ctx.beginPath(); ctx.arc(b.x, b.y, vr + 4, 0, TAU); ctx.stroke();

      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(gameT * 15);

/* ---------- 卡牌网格（4 列；写 window.PAUSE_CARD_HITS={x,y,w,h,id}） ---------- */
function drawPauseCardGrid(cards, y0) {
  const cw2 = 104, ch2 = 110, gx = 6, gy = 8, cols = 4;
  const x0 = (W - (cols * cw2 + (cols - 1) * gx)) / 2;
  window.PAUSE_CARD_HITS = [];
  cards.forEach((c, i) => {

    const x = x0 + col * (cw2 + gx), y = y0 + row * (ch2 + gy);

    window.PAUSE_CARD_HITS.push({ x, y, w: cw2, h: ch2, id: c.id });

  if (S.paused && S.mode === 'play') drawPause(); else pauseCursor(false); // 2026-11-04：非暂停态复位悬浮光标
  if (S.mode === 'over') drawOver();

  if (S.mode === 'play' && !S.picking && !S.shop && !S.cardbook && !S.paused) drawCannonTooltip();
  if (S.cardbook) drawCardbook();

}

/* ---------- V4.3 毒云渲染 + 赛博朋克扫描线 ---------- */
function drawClouds() {

    for (let i = 0; i < 5; i++) { // 翻涌雾团：不同相位呼吸
      const a2 = gameT * 0.7 + i * 1.256;
      const bx = c.x + Math.cos(a2) * R * 0.45, by = c.y + Math.sin(a2 * 1.3) * R * 0.3;
      const br = R * (0.28 + 0.07 * Math.sin(gameT * 2 + i));

  }
}

  if (hit.frz) debuffs.push(['冻结', hit.frz + ' 层·易伤', '#c9f2ff']); // R2fireice：冻结=永久易伤层

function ptOf(e) {

    blocks: () => S.blocks.map(b => ({ x: Math.round(b.x), y: Math.round(b.y), w: b.w, h: b.h, shape: b.shape, hp: b.hp, maxHp: b.maxHp, type: b.type, gid: b.gid, rot: b.rot, drift: !!b.driftA, boss: !!b.boss, bossType: b.bossType || null, shield: b.shieldCur || 0, shieldMax: b.shieldMax || 0, intang: !!b.intang, frozen: b.frozen || 0, critT: +(b.critT || 0).toFixed(3), frail: b.frail || 0, frailG: b.frailG || 0, burn: +(b.burn || 0).toFixed(2), burnL: b.burnL || 0, burnPer: +(b.burnPer || 0).toFixed(3), trueFire: b.trueFire || 0, poison: b.poison || 0, frost: b.frost || 0, frz: b.frz || 0, virus: b.virus || 0, bleed: b.bleed || 0, annih: b.annih || 0, charge: b.charge || 0, mark: b.mark || 0, tid: b.tid || 0, summoned: !!b.summoned })), // R2fireice 2026-11-04：快照改 frz（冻结易伤层）+trueFire（真火）；旧 freeze 计时/freezeL/burnFire 随机制下线 // 2026-11-03 暗影斩杀改版：annih=湮蚀标记层；R2dark：corrode 快照键随侵蚀体系删除
    block: (t, x, y, extra) => {
      // 测试直通口：指定类型/位置造块（不检测重叠，便于靶场实验）
      const hp0 = extra && extra.hp ? extra.hp : Math.max(2, hpBase(S.wave));
      const spec = Object.assign({ shape: 'rect', w: 50, h: 30, type: t, hp: hp0, maxHp: hp0 }, extra || {}, { x, y });
      const nb = Object.assign({ id: ++S.blkSeq, flash: 0, dead: false, gid: null, fuse: false, rot: 0, born: gameT, frozen: 0, frozenBonus: false }, spec);
      S.blocks.push(nb);
      return true;
    },
    boss: (t) => spawnBoss(t),
    noDrops: (v) => { NO_DROPS_MODE = v === undefined ? true : !!v; return NO_DROPS_MODE; }, // 2026-11-04 测试口：静默自然掉落（跨局存活；forced debug.drop 放行）
    pause: (v) => { S.paused = (v === undefined) ? true : !!v; if (S.paused) S.pausePage = null; if (S.paused) S.pauseT = 0; return S.paused; }, // 2026-11-04 暂停图鉴测试口：开暂停并重置暂停时钟；2026-11-09 分级改版：默认已选卡页
    hover: (x, y) => { S.mouse = { x: (x == null ? -999 : x), y: (y == null ? -999 : y) }; return S.mouse; }, // 悬浮位置注入（hover 动画/光标验证）
    tap: (x, y) => handlePauseClick({ x, y }), // 暂停层点击直通（与 pointerdown 同路径）
    dropChance: () => dropChance(), // 2026-11-04 幸运星观测口：掉落率全乘区
    luckSurge: (roll) => luckSurgeWaveRoll(roll), // 2026-11-04 幸运潮观测口：可注入掷骰值验证阈值
    summon: () => { let n = 0; for (const b of S.blocks) { if (b.boss && b.bossType === 'summon' && !b.dead) n += summonNear(b); } return n; },
    balls: () => S.balls.map(b => ({ kind: b.kind, pierce: !!b.pierce, pl: b.pierceLeft || 0, wh: (b.wheelPos || []).length, x: Math.round(b.x), y: Math.round(b.y), r: +b.r.toFixed(1), vx: Math.round(b.vx), vy: Math.round(b.vy), ret: b.ret || 0, melt: b.meltBonus || 0, gen: b.gen || 0, fromSplit: !!b.fromSplit, slug: !!b.slug })),
    rail: () => ({ mult: +railSpeedMult().toFixed(2), dmg: railHitDmg(), charge: S.railCharge || 0, killDmg: S.railKillDmg || 0, cap: railSpdCap(), capSpd: spdCap(), volleyKill: !!S.railVolleyKill }),
    ents: () => ({ rays: S.rays.length, bees: S.bees.length, bolts: S.bolts.length, beams: S.beams.length }), // 2026-11-10：beams=激光光柱实体观测口
    beams: () => S.beams.map(bm => ({ type: bm.type || 'line', x1: Math.round(bm.x1 || 0), y1: Math.round(bm.y1 || 0), x2: Math.round(bm.x2 || 0), y2: Math.round(bm.y2 || 0), x: Math.round(bm.x || 0), y: Math.round(bm.y || 0), r: bm.r || 0, col: bm.col || null })), // 2026-11-10：光柱几何观测口（直线束/光环）
    queue: () => S.launchQ.map(l => l.kind), // Wave5：发射队列观测口（弹药回填金弹入队验证）
    fuse: (a, b) => doFuse(a, b),
    fuseIns: (ins) => doFuseIns(Array.isArray(ins) ? ins : [ins]),
    elem: (k, n) => { if (!(k in S.elem)) return false; S.elem[k] += (n == null ? 1 : n | 0); return Object.assign({}, S.elem); },
    codex: () => ({
      elems: Object.keys(ELEMS).map(k => ({ id: k, name: ELEMS[k].name, c: ELEMS[k].c, fx: ELEMS[k].fx, lv: ELEMS[k].lv })),
      balls: BASIC_BALLS.concat(FUSE_ORDER).map(bid => ({ id: bid, name: BALL_CN[bid] || bid, elems: BALL_ELEMS[bid] || [], nodes: (TREE_DEFS[bid] || { nodes: [] }).nodes.map(nd => ({ id: nd.id, rarity: nd.rarity, name: nd.name, desc: nd.desc, max: nd.max || 1 })), evo: EVO_BALLS.has(bid), recipe: (FUSE_RECIPES.find(r => r.out === bid) || { ins: null }).ins })),
      evoRoutes: FUSE_RECIPES.filter(r => EVO_BALLS.has(r.out)).map(r => ({ id: 'fuse_' + r.out, ins: r.ins, out: r.out, name: r.name, desc: r.desc })), // 2026-11-09 十批：高级球唯一配方=二级配方（融合球+基础球）
      cards: LEVEL_POOL.filter(c => String(c.id).indexOf('t_') !== 0).map(c => ({ id: c.id, rarity: c.rarity, name: c.name, desc: c.desc, cat: c.cat || 'sys', elem: c.elem || null, ball: c.ball || null, stack: c.stack || null })),
      poolSize: LEVEL_POOL.length, slots: { used: slotsUsed(), cap: SLOT_CAP }, char: S.char
    }),
    makeGold: () => makeGold(),
    feed: (kind, n) => {
      const m = n == null ? 1 : (n | 0);
      if (kind === 'ball') { S.arsenal += m; return S.arsenal; }
      if (kind === 'char') { const ch = CHARS.find(c => c.id === n); if (ch) { S.char = ch.id; ch.apply(); addBall(ch.ball, 2); } return S.char; }
      if (kind in S.perm) { S.perm[kind] += m; return S.perm[kind]; }
      if (kind === 'gold' || FUSE_IDS.has(kind)) { S.fuse[kind] = (S.fuse[kind] || 0) + m; if (kind === 'gold') S.hadGold = true; return S.fuse[kind]; }
      return false;
    },
    tree: (ball, nodeId) => tryTree(ball, nodeId),
    altar: () => { const o = buildAltarOptions(); return (o.length ? o : pickFallback3()).map(x => x.id); },
    shop: (force) => { const open = toggleShop(force); return { open, model: shopModel() }; },
    pick: (i) => pickCard(i),
    pickStat: (i) => pickStatBoost(i), // V4.1：弃卡换属性观测口
    frost: (tid, n) => { const t = S.blocks.find(b => b.tid === tid && !b.dead); if (!t) return false; applyFrost(t, n == null ? 1 : n | 0); return true; }, // V4.6：冰冻直注口
    burn: (tid, n) => { const t = S.blocks.find(b => b.tid === tid && !b.dead); if (!t) return false; ignite(t, 'fire', n == null ? 1 : n | 0); return true; }, // 2026-11-09：点燃直注口（走真实 ignite 入口——热冲击对冲/燃层队列全套生效；srcKind='fire'，燃弹树 ssr1 点亮时为真火）
    poison: (tid, n) => { const t = S.blocks.find(b => b.tid === tid && !b.dead); if (!t) return false; applyPoison(t, n == null ? 1 : n | 0); return true; }, // 2026-11-10：中毒直注口（无上限口径验证）
    buff: (id, t) => { addBuff(id, t == null ? 1 : +t); return S.buffs.map(x => ({ id: x.id, t: x.t })); }, // 2026-11-10：增益注入观测口（按波计时验证）
    fire: (a) => { fire(a == null ? -Math.PI / 2 : +a); return S.volley; }, // 2026-11-10：发射直通口（回合推进/独头弹散射验证）
    frostNeed: () => frostNeed(), // V4.13：碎裂门槛观测口
    reroll: () => rerollOptions(), // V4.2：刷新选卡观测口
    taken: () => Object.assign({}, S.taken), // V4.2：卡册记账观测口
    discardPicks: () => { S.levelQ.length = 0; S.picking = null; return true; }, // V4.1：测试隔离口——丢弃待选（不施加任何卡）
    statBoosts: () => STAT_BOOSTS.map(s => ({ id: s.id, lab: s.lab })), // V4.1：属性强化清单
    gainXp: (n) => gainXp(n), // V4.1：经验直通口（曲线/升级观测）
    splits: () => S.splitCount,
    rollRarity: (n) => { const out = []; for (let i = 0; i < Math.max(1, n | 0); i++) out.push(rollRarityOnce()); return out; },
    setPity: (sr, ssr) => { S.pity.sr = sr | 0; S.pity.ssr = ssr | 0; return { sr: S.pity.sr, ssr: S.pity.ssr }; },
    setShield: (n) => { S.shield = n | 0; return S.shield; },
    over: () => { gameOver(); return S.mode; }, // 测试兑底：强 build 可能长期自然不死，确定性验证结算流
    applyCard: (id) => { const c = LEVEL_POOL.find(cc => cc.id === id); if (!c) return false; c.apply(1); return true; },
    canCard: (id) => { const c = LEVEL_POOL.find(cc => cc.id === id); return c ? !!c.can() : null; }, // Wave4：卡池门禁观测口（applyCard 直通不走 can，门禁需独立验证）
    execLine: (annih) => +darkExecLine({ annih: annih || 0 }).toFixed(4), // R2dark 2026-11-04 斩杀线观测口：给定湮蚀标记层回当前斩杀线（小数）
    pool: () => LEVEL_POOL, // V4.10：卡面审计口（只读引用）
    setWave: (n) => { S.wave = Math.max(1, n | 0); const stmA = stageMod(); S.windX = stmA && stmA.wind ? rollWindX() : 0; S.lastStage = Math.floor((S.wave - 1) / 10) % STAGES.length; for (const p of S.ambient) respawnAmbient(p, true); return S.wave; }, // V4.19 测试直通口（2026-11-06 风力增强与波内同步）
    wind: () => S.windX, // V4.19 风况观测口
    elemLv: (e) => elemLv(e), // V4.19 元素等级观测口（含关卡暂时加成）
    stages: () => STAGES.map(s => ({ name: s.name, theme: (s.mod || {}).theme || null, elem: (s.mod || {}).elem || null, elemN: (s.mod || {}).elemN || 0, wind: !!(s.mod || {}).wind, strikes: (s.mod || {}).strikes || 0 })), // V4.19 关卡清单观测口
  },
  errors: ERRS
};
