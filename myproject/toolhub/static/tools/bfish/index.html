// ==================== 基础工具 ====================
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function rand(a, b){ return a + Math.random() * (b - a); }
function dist2(ax, ay, bx, by){ var dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
function lerpAngle(a, b, t){
  var d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function newCanvas(w, h){
  var c = document.createElement("canvas");
  c.width = Math.max(2, Math.ceil(w)); c.height = Math.max(2, Math.ceil(h));
  return c;
}

var qLevel = (window.devicePixelRatio || 1) > 1.5 ? 2 : 1;
var qTimer = 0, frameEMA = 0.016;
var QBUB = [14, 26, 42], QPART = [90, 170, 260], QRAY = [0, 2, 4];

function cameraViewportScale(w,h){return Math.hypot(w===undefined?W:w,h===undefined?H:h)/Math.hypot(1280,800)||1;}
function cameraLogicalZoom(){return cam.z/cameraViewportScale();}
function resizeCanvas(){
  var oldScale=cameraViewportScale();
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(Math.max(1.25,Math.min(window.devicePixelRatio||1.25,QDPR[qLevel])),Math.sqrt([1600000,2400000,3200000][qLevel]/Math.max(1,W*H)));
  if(typeof cam!=='undefined'&&cam)cam.z*=cameraViewportScale()/oldScale;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
}
function qualityTick(dt){
  frameEMA = frameEMA * 0.95 + Math.min(dt, 0.1) * 0.05;
  qTimer += dt;
  if (qTimer < 2.5) return;
  qTimer = 0;
  if (frameEMA > 0.023 && qLevel > 0){ qLevel--; resizeCanvas(); }
  else if (frameEMA < 0.0145 && qLevel < 2 && DPR < (window.devicePixelRatio || 1)){ qLevel++; resizeCanvas(); }
}

// 海床高度场: 左侧大陆斜坡俯冲深海沟 → 中部海岭平原(含海隆) → 右侧珊瑚陆架, 多级 smoothstep + 连续波浪
var FLOOR = new Float32Array(Math.ceil(CONF.WORLD_W / 10) + 2);
function bakeFloor(){
  var HW = CONF.WORLD_H;
  for (var i = 0; i < FLOOR.length; i++){
    var x = i * 10;
    var t1 = clamp((x - 3000) / 5200, 0, 1); t1 = t1 * t1 * (3 - 2 * t1);
    var t2 = clamp((x - 19000) / 3600, 0, 1); t2 = t2 * t2 * (3 - 2 * t2);
    var base = lerp(HW - 170, HW - 2650, t1);
    base = lerp(base, HW - 1450, t2);
    var gr = (x - 12800) / 2200; // 中部海隆上凸(海藻林高地)
    base -= Math.exp(-gr * gr) * 420;
    var tr = (x - 7600) / 520;  // 斜坡肩部海沟
    base += Math.exp(-tr * tr) * 240;
    var wave = Math.sin(x * 0.0016) * 150 + Math.sin(x * 0.0047 + 2) * 75 + Math.sin(x * 0.013 + 1) * 28 + Math.sin(x * 0.041) * 8;
    FLOOR[i] = clamp(base + wave, HW - 3150, HW - 55);
  }
}
function floorAt(x){
  var fi = x / 10, i = Math.floor(fi);
  if (i < 0) return FLOOR[0];
  if (i >= FLOOR.length - 1) return FLOOR[FLOOR.length - 1];
  return FLOOR[i] + (FLOOR[i + 1] - FLOOR[i]) * (fi - i); // 列间线性插值→连续曲面(螃蟹爬坡/游动不再台阶)
}
// 区域权重: [阳光带, 珊瑚陆架, 深渊盆地], 其余为远洋
function zoneW(x, y){
  var shLine = 1350 + Math.sin(x * 0.0008) * 220 + Math.sin(x * 0.00028 + 2) * 140;
  var wS = clamp(1 - (y - shLine) / 430, 0, 1);
  var coralEdge = 18800 + Math.sin(y * 0.0012) * 280 + Math.sin(y * 0.0004 + 1) * 170;
  var wC = clamp(1 - (coralEdge - x) / 500, 0, 1);
  var dx = x - 3800, dy = y - 10600;
  var wD = clamp(1 - Math.sqrt(dx * dx + dy * dy) / 6400, 0, 1);
  if (x < 9500 && y > 12200){
    var corner = Math.min(1, (9500 - x) / 800) * Math.min(1, (y - 12200) / 500);
    if (corner > wD) wD = corner;
  }
  return [wS, wC, wD];
}
function zoneAt(x, y){
  var w = zoneW(x, y);
  var best = 3, bw = 0.42;
  if (w[0] > bw){ bw = w[0]; best = 0; }
  if (w[1] > bw){ bw = w[1]; best = 1; }
  if (w[2] > bw){ bw = w[2]; best = 2; }
  return best;
}
// 热泉上升流强度: 柱内返回 0..1(周期喷发, 纯函数零分配)
function ventLift(x, y, t){
  var lift = 0;
  for (var i = 0; i < VENTS.length; i++){
    var v = VENTS[i];
    var s = Math.sin((t + v.off) * (Math.PI * 2 / 7));
    if (s <= 0.05) continue;
    var dx = Math.abs(x - v.x);
    if (dx > 70) continue;
    var dy = v.y - y;
    if (dy < 0 || dy > 680) continue;
    var st = s * (1 - dx / 70) * (0.35 + 0.65 * (1 - dy / 680));
    if (st > lift) lift = st;
  }
  return lift;
}

var PLAYER_SPEC = { shape: "oval", ry: 0.58, c1: "#ffcf4d", c2: "#fff3c2", c3: "#ff8f00", pat: "line", tail: "fork" };

// ==================== 精灵图缓存 ====================
var SP = {};   // 所有烘焙好的精灵

function darken(hex, f){
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function eye(g, x, y, r){
  g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#101418"; g.beginPath(); g.arc(x + r * 0.18, y, r * 0.52, 0, Math.PI * 2); g.fill();
  g.fillStyle = "rgba(255,255,255,0.9)"; g.beginPath(); g.arc(x - r * 0.25, y - r * 0.3, r * 0.22, 0, Math.PI * 2); g.fill();
}

// 把鱼身画到 (0,0) 朝 +x, R 为半长
function bakeFishBody(g, sp, R){
  var ry = R * sp.ry;
  var grad = g.createLinearGradient(0, -ry, 0, ry);
  grad.addColorStop(0, sp.c1); grad.addColorStop(1, sp.c2);
  var sh = sp.shape;

  g.fillStyle = grad;
  if (sh === "ray"){
    g.beginPath();
    g.moveTo(R * 1.1, 0);
    g.quadraticCurveTo(R * 0.35, -ry * 1.9, -R * 0.25, -ry * 2.1);
    g.quadraticCurveTo(-R * 0.75, -ry * 0.9, -R * 0.9, 0);
    g.quadraticCurveTo(-R * 0.75, ry * 0.9, -R * 0.25, ry * 2.1);
    g.quadraticCurveTo(R * 0.35, ry * 1.9, R * 1.1, 0);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,0.25)";
    g.beginPath(); g.ellipse(R * 0.1, 0, R * 0.55, ry * 1.2, 0, 0, Math.PI * 2); g.fill();
    eye(g, R * 0.5, -ry * 0.55, R * 0.09);
    eye(g, R * 0.5, ry * 0.55, R * 0.09);
    // 细尾
    g.strokeStyle = sp.c3; g.lineWidth = Math.max(2, R * 0.07); g.lineCap = "round";
    g.beginPath(); g.moveTo(-R * 0.9, 0); g.lineTo(-R * 1.9, 0); g.stroke();
    return;
  }
  if (sh === "shark"){
    g.beginPath(); g.ellipse(0, 0, R * 1.18, ry, 0, 0, Math.PI * 2); g.fill();
    // 背鳍
    g.fillStyle = sp.c3;
    g.beginPath(); g.moveTo(-R * 0.25, -ry * 0.8); g.quadraticCurveTo(-R * 0.05, -ry * 2.0, R * 0.3, -ry * 0.75); g.closePath(); g.fill();
    // 鳃
    g.strokeStyle = "rgba(40,55,66,0.55)"; g.lineWidth = Math.max(1.5, R * 0.05);
    for (var i = 0; i < 3; i++){
      g.beginPath(); g.arc(R * (0.32 + i * 0.1), 0, ry * 0.55, -0.5, 0.5); g.stroke();
    }
    eye(g, R * 0.85, -ry * 0.3, R * 0.09);
    return;
  }
  if (sh === "sword"){
    g.beginPath(); g.ellipse(0, 0, R * 1.12, ry, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = sp.c3; g.lineWidth = Math.max(2, R * 0.08); g.lineCap = "round";
    g.beginPath(); g.moveTo(R * 1.05, -ry * 0.1); g.lineTo(R * 1.7, -ry * 0.35); g.stroke();
    g.fillStyle = sp.c3;
    g.beginPath(); g.moveTo(-R * 0.1, -ry); g.quadraticCurveTo(R * 0.05, -ry * 1.8, R * 0.25, -ry * 0.9); g.closePath(); g.fill();
    eye(g, R * 0.72, -ry * 0.25, R * 0.09);
    return;
  }
  if (sh === "eel"){
    g.beginPath(); g.ellipse(0, 0, R * 1.25, ry, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = sp.c3; g.globalAlpha = 0.55;
    g.beginPath();
    g.moveTo(-R * 1.1, -ry * 0.2);
    g.quadraticCurveTo(0, -ry * 1.9, R * 1.05, -ry * 0.5);
    g.quadraticCurveTo(0, -ry * 1.1, -R * 1.1, -ry * 0.2);
    g.fill();
    g.globalAlpha = 1;
    eye(g, R * 0.95, -ry * 0.25, R * 0.08);
    return;
  }
  if (sh === "angler"){
    g.beginPath(); g.ellipse(0, 0, R * 0.95, ry, 0, 0, Math.PI * 2); g.fill();
    // 大嘴与牙
    g.fillStyle = "#1a1017";
    g.beginPath(); g.arc(R * 0.55, ry * 0.15, R * 0.34, -0.4, 1.6); g.fill();
    g.fillStyle = "#e8f4ff";
    for (var t = 0; t < 4; t++){
      var tx = R * (0.32 + t * 0.1);
      g.beginPath(); g.moveTo(tx, ry * 0.12); g.lineTo(tx + R * 0.04, ry * 0.3); g.lineTo(tx + R * 0.08, ry * 0.12); g.fill();
    }
    // 灯笼
    g.strokeStyle = sp.c3; g.lineWidth = Math.max(2, R * 0.06);
    g.beginPath(); g.moveTo(R * 0.15, -ry * 0.8); g.quadraticCurveTo(R * 0.55, -ry * 1.7, R * 0.95, -ry * 1.3); g.stroke();
    var lg = g.createRadialGradient(R * 0.95, -ry * 1.3, 0, R * 0.95, -ry * 1.3, R * 0.3);
    lg.addColorStop(0, "rgba(200,255,220,1)"); lg.addColorStop(0.4, "rgba(150,255,190,0.7)"); lg.addColorStop(1, "rgba(120,255,170,0)");
    g.fillStyle = lg; g.beginPath(); g.arc(R * 0.95, -ry * 1.3, R * 0.3, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#eafff0"; g.beginPath(); g.arc(R * 0.95, -ry * 1.3, R * 0.09, 0, Math.PI * 2); g.fill();
    eye(g, R * 0.45, -ry * 0.3, R * 0.1);
    return;
  }
  if (sh === "puff"){
    // 刺
    g.strokeStyle = sp.c3; g.lineWidth = Math.max(2, R * 0.06); g.lineCap = "round";
    for (var s2 = 0; s2 < 12; s2++){
      var a2 = s2 / 12 * Math.PI * 2;
      g.beginPath();
      g.moveTo(Math.cos(a2) * R * 0.9, Math.sin(a2) * R * 0.9 * sp.ry / 0.85);
      g.lineTo(Math.cos(a2) * R * 1.12, Math.sin(a2) * R * 1.12 * sp.ry / 0.85);
      g.stroke();
    }
    g.beginPath(); g.arc(0, 0, R * 0.9, 0, Math.PI * 2); g.fill();
    g.fillStyle = sp.c3; g.globalAlpha = 0.5;
    g.beginPath(); g.ellipse(-R * 0.2, R * 0.1, R * 0.5, R * 0.4, 0, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    eye(g, R * 0.42, -R * 0.16, R * 0.13);
    return;
  }
  // oval / tall / slim 通用椭圆
  g.beginPath(); g.ellipse(0, 0, R, ry, 0, 0, Math.PI * 2); g.fill();
  // 背鳍
  g.fillStyle = sp.c3; g.globalAlpha = 0.85;
  var dh = sh === "tall" ? ry * 0.9 : ry * 0.55;
  g.beginPath();
  g.moveTo(-R * 0.3, -ry * 0.8);
  g.quadraticCurveTo(-R * 0.05, -ry - dh, R * 0.3, -ry * 0.75);
  g.closePath(); g.fill();
  // 胸鳍
  g.beginPath();
  g.moveTo(R * 0.15, ry * 0.3);
  g.quadraticCurveTo(R * 0.05, ry * 1.15, -R * 0.25, ry * 0.75);
  g.closePath(); g.fill();
  g.globalAlpha = 1;

  // 花纹
  if (sp.pat === "line"){
    g.fillStyle = "rgba(255,255,255,0.35)";
    g.fillRect(-R * 0.85, -ry * 0.08, R * 1.7, Math.max(2, ry * 0.16));
  } else if (sp.pat === "spots"){
    g.fillStyle = sp.c3; g.globalAlpha = 0.45;
    var pts = [[-0.5, -0.2], [-0.1, 0.15], [0.3, -0.25], [0.45, 0.2], [-0.65, 0.3]];
    for (var p2 = 0; p2 < pts.length; p2++){
      g.beginPath(); g.arc(R * pts[p2][0], ry * pts[p2][1], Math.max(1.5, R * 0.07), 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  } else if (sp.pat === "clown"){
    g.fillStyle = "rgba(255,255,255,0.92)";
    g.strokeStyle = "rgba(30,30,30,0.5)"; g.lineWidth = Math.max(1, R * 0.03);
    var xs = [-0.45, 0.08, 0.55];
    for (var c2i = 0; c2i < 3; c2i++){
      g.beginPath();
      g.rect(R * xs[c2i] - R * 0.07, -ry * 0.85, R * 0.14, ry * 1.7);
      g.fill(); g.stroke();
    }
  } else if (sp.pat === "band"){
    g.fillStyle = "rgba(30,30,30,0.55)";
    g.beginPath(); g.rect(R * 0.42, -ry * 0.9, Math.max(2, R * 0.1), ry * 1.8); g.fill();
  }

  eye(g, R * 0.5, -ry * 0.14, Math.max(2.5, R * 0.13));
}

function bakeTail(g, type, R, col){
  g.fillStyle = col; g.globalAlpha = 0.88;
  if (type === "fork"){
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(-R * 0.72, -R * 0.48);
    g.quadraticCurveTo(-R * 0.35, 0, -R * 0.72, R * 0.48);
    g.closePath(); g.fill();
  } else if (type === "round"){
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(-R * 0.85, -R * 0.52, -R * 0.62, 0);
    g.quadraticCurveTo(-R * 0.85, R * 0.52, 0, 0);
    g.fill();
  } else if (type === "point"){
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(-R * 0.55, -R * 0.3);
    g.lineTo(-R * 0.55, R * 0.3);
    g.closePath(); g.fill();
  } else if (type === "ribbon"){
    g.fillRect(-R * 0.95, -Math.max(2.5, R * 0.11), R * 0.95, Math.max(5, R * 0.22));
  } else { // thin
    g.fillRect(-R * 1.05, -Math.max(1.5, R * 0.065), R * 1.05, Math.max(3, R * 0.13));
  }
  g.globalAlpha = 1;
}

function makeFishSprites(sp){
  var R = sp.bakeR || Math.max(40, sp.sMax * 0.95); // 高分辨率烘焙, 防放大像素块又不过度填充
  var bw = R * 3.9, bh = R * (2.2 + sp.ry * 2.2);
  if (sp.shape === "angler") bh += R * 0.8;
  var body = newCanvas(bw, bh);
  var bg = body.getContext("2d");
  bg.translate(bw / 2, bh / 2);
  bakeFishBody(bg, sp, R);

  var tw = R * 1.15 + 8, th = R * 1.35 + 8;
  var tail = newCanvas(tw, th);
  var tg = tail.getContext("2d");
  tg.translate(tw - 3, th / 2);
  bakeTail(tg, sp.tail, R, sp.c3);

  // 尾鳍挂点按体型外移, 防止长身体盖住尾巴显得"没尾巴"
  var tailX = -0.78;
  if (sp.shape === "eel") tailX = -1.02;
  else if (sp.shape === "shark") tailX = -1.0;
  else if (sp.shape === "sword") tailX = -0.95;
  else if (sp.shape === "slim") tailX = -0.88;
  else if (sp.shape === "puff") tailX = -0.82;

  return {
    body: body, tail: tail, bakeR: R, tailX: tailX,
    tailAmp: sp.tail === "ribbon" ? 0.28 : (sp.tail === "thin" ? 0.22 : (sp.tail === "point" ? 0.5 : 0.42)),
    tailLen: (sp.tail === "thin" ? R * 1.15 : R * 0.88)
  };
}

function makeGlowSprite(r, color){
  var c = newCanvas(r * 2, r * 2), g = c.getContext("2d");
  var gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, color); gr.addColorStop(1, "rgba(255,180,60,0)");
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  return c;
}

function makeParticleSprite(color){

  return c;
}

  } else {                                          // 鲸形: 钝头 + 尾鳍 + 背瘤 + 长胸鳍
    g.moveTo(102, -4); g.quadraticCurveTo(82, -30, 36, -32);

function FF_init(){

  // 带配置: par 视差 / a 透明(远=暗) / sz 基准体长 / bl 放大模拟模糊 / y0-y1 活动水层
  FF_BANDS = [

  // 9 个群(每带 3 个)锚点池 + 38 条鱼对象池; 之后 update/draw 零分配

  for (b = 0; b < 3; b++){

function FF_update(dt){
  var i, f, sc, nx, ny, bd;
  for (i = 0; i < FF_SCH.length; i++){              // 锚点漂移 + 回绕
    sc = FF_SCH[i];
    sc.t += dt;
    sc.x += sc.vx * dt;
    sc.y += Math.sin(sc.t * 0.12 + i * 2.1) * 10 * dt;
    if (sc.x < -600) sc.x += FF_RANGE + 1200;
    else if (sc.x > FF_RANGE + 600) sc.x -= FF_RANGE + 1200;
  }
  for (i = 0; i < FF_FISH.length; i++){             // 绕锚点游 + 正弦扰动, 朝向速度方向
    f = FF_FISH[i]; sc = FF_SCH[f.s]; bd = FF_BANDS[f.b];
    f.a += f.w * dt;
    nx = sc.x + Math.cos(f.a) * f.r + Math.sin(survivalTime * f.sw + f.ph) * f.amp;
    ny = sc.y + Math.sin(f.a) * f.r * 0.55 + Math.cos(survivalTime * f.sw * 0.8 + f.ph) * f.amp * 0.7;
    if (ny < bd.y0) ny = bd.y0; else if (ny > bd.y1) ny = bd.y1;
    if (Math.abs(nx - f.x) + Math.abs(ny - f.y) > 0.5)
      f.ang = Math.atan2(ny - f.y, nx - f.x);       // 位移过小保持原朝向, 防抖
    f.x = nx; f.y = ny;
  }
  for (i = 0; i < FF_WHALE.length; i++){            // 巨影极慢横移 + 回绕
    f = FF_WHALE[i];
    f.x += f.vx * dt;
    if (f.x < -1600) f.x += FF_RANGE + 3200;
    else if (f.x > FF_RANGE + 1600) f.x -= FF_RANGE + 3200;
  }
}

function FF_draw(time){
  if (qLevel === 0 || !FF_SPR) return;              // q0 全跳过
  var z = cam.z, hw = W / (2 * z) + 80, hh = H / (2 * z) + 80;
  var vL = cam.x - hw, vR = cam.x + hw, vT = cam.y - hh, vB = cam.y + hh;
  var bStart = qLevel === 2 ? 0 : 1;                // q1 只画 par 0.5/0.7 两带
  var i, f, bd, dx, dy, m, spr, wS, hS, ang;
  for (i = 0; i < FF_FISH.length; i++){
    f = FF_FISH[i];
    if (f.b < bStart) continue;
    bd = FF_BANDS[f.b];
    dx = cam.x + (f.x - cam.x) * bd.par;            // 世界系视差坐标
    dy = cam.y + (f.y - cam.y) * bd.par + Math.sin(time * 0.9 + f.ph) * 3;
    m = f.sz * bd.bl;
    if (dx < vL - m || dx > vR + m || dy < vT - m || dy > vB + m) continue;
    spr = FF_SPR[f.b][f.spr];
    wS = f.sz * bd.bl; hS = wS * spr.height / spr.width;
    ang = f.ang + Math.sin(time * 0.7 + f.ph) * 0.06;
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(ang);
    if (Math.cos(ang) < 0) ctx.scale(1, -1);        // 掉头时背鳍仍朝上 (同 drawFishSprite)
    ctx.globalAlpha = bd.a;
    ctx.drawImage(spr, -wS / 2, -hS / 2, wS, hS);
    ctx.restore();
  }
  if (qLevel === 2 && FF_WSPR){                     // 极远巨影带: 仅 q2
    for (i = 0; i < FF_WHALE.length; i++){
      f = FF_WHALE[i];
      dx = cam.x + (f.x - cam.x) * 0.15;
      dy = cam.y + (f.y - cam.y) * 0.15 + Math.sin(time * 0.05 + f.ph) * 46;
      m = f.w * 0.7;
      if (dx < vL - m || dx > vR + m || dy < vT - m || dy > vB + m) continue;
      wS = f.w; hS = wS * FF_WSPR.height / FF_WSPR.width;
      ctx.save();
      ctx.translate(dx, dy);
      ctx.rotate(Math.sin(time * 0.04 + f.ph) * 0.04);
      if (f.vx < 0) ctx.scale(-1, 1);
      ctx.globalAlpha = f.a + Math.sin(time * 0.1 + f.ph) * 0.01; // 0.10-0.16 内呼吸
      ctx.drawImage(FF_WSPR, -wS / 2, -hS / 2, wS, hS);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function SF_waveY(x, t){  // 3 个 sin 叠加: λ=260/520/90, 总幅 6+3.5+4.5=14
  return Math.sin(x * 0.02417 + t * 1.6) * 6
       + Math.sin(x * 0.01208 - t * 0.8 + 2.1) * 3.5
       + Math.sin(x * 0.06981 + t * 2.6 + 4.6) * 4.5;
}

function SF_draw(time){  // render() 内调用; 天空位于背景之上、一切实体之下
  var vT = cam.y - H / (2 * cam.z) - 80;
  if (vT >= 700) return;                       // 总剔除: 视口顶还深在水下
  if (!SF_skyPat) SF_init();                   // 惰性兜底(正常启动时已调 SF_init)
  if (vT >= 20) return;                        // 视口顶低于波谷: 天空与波面均不可见
  var vL = cam.x - W / (2 * cam.z) - 80, vR = cam.x + W / (2 * cam.z) + 80;
  var step = qLevel >= 2 ? 40 : 80, n = Math.ceil((vR - vL) / step), i, x, y, cx, cy, s;
  // ---- (a) 天空区: 视口顶→波面 的多边形, 下亮青金→上暖蓝 ----
  ctx.beginPath();
  ctx.moveTo(vL, vT); ctx.lineTo(vR, vT);
  for (i = n; i >= 0; i--){
    x = vL + i * step;
    y = qLevel === 0 ? Math.sin(x * 0.02417 + time * 1.6) * 6 : SF_waveY(x, time);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = qLevel === 0 ? "#a5d4d8" : SF_skyPat;  // q0: 纯色天空
  ctx.fill();
  if(window.drawLivingSky)drawLivingSky(time,vL,vR,vT);
  if (qLevel > 0){
    ctx.fillStyle = SF_foamPat;                // 水面下 80px 光带
    ctx.beginPath();
    for (i = 0; i <= n; i++){ x = vL + i * step; ctx.lineTo(x, SF_waveY(x, time) + 2); }
    for (i = n; i >= 0; i--){ x = vL + i * step; ctx.lineTo(x, SF_waveY(x, time) + 82); }
    ctx.closePath(); ctx.fill();
  }

  // ---- (b) 波面泡沫线: 2px 白, 透明度随 sin 呼吸; q0 单 sin ----
  ctx.lineWidth = 2; ctx.strokeStyle = "#ffffff";
  ctx.globalAlpha = qLevel === 0 ? 0.55 : 0.5 + 0.28 * Math.sin(time * 2.2);
  ctx.beginPath();
  for (i = 0; i <= n; i++){
    x = vL + i * step;
    y = qLevel === 0 ? Math.sin(x * 0.02417 + time * 1.6) * 6 : SF_waveY(x, time);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function SF_updateSurface(dt){  // update() 内, 玩家 y 钳制(含海底)之后调用
  if (!player.alive) return;
  var wy = SF_waveY(player.x, survivalTime);
  if (player.breachT > 0){
    // —— 跃出模式: 不钳制, 空中加重力, 允许升到 y >= -80 ——
    player.breachT -= dt;
    player.vy += 950 * dt;
    if (player.y < -80){ player.y = -80; if (player.vy < 0) player.vy = 0; }
    if (player.vy > 0 && player.y - player.size * 0.3 >= wy){
      player.breachT = 0;                      // 落水瞬间: 涟漪+白浪花, 回钳制模式
      emitRipple(player.x, wy, player.size * 2.2);
      emitParticles(player.x, wy, 12, 0);      // 0 号粒子=白色
      player.y = wy + player.size * 0.3; player.vy = 0;
      SF_prevAir = false;
    } else {
      if (player.breachT <= 0) player.breachT = 0;  // 到期: 交还钳制分支继续下坠
      SF_prevAir = true;
    }
    return;
  }
  // —— 钳制模式 ——
  if (player.y - player.size * 0.3 < wy){      // 头部高出波面
    if (player.vy < -240){                     // 上冲够快: 出水瞬间浪花, 进入跃出
      emitRipple(player.x, wy, player.size * 2.2);
      emitParticles(player.x, wy, 12, 0);
      player.breachT = 0.9;
      SF_prevAir = true;
    } else {
      if (SF_prevAir){                         // 到期后从空中落回: 补一次入水浪花
        emitRipple(player.x, wy, player.size * 2.2);
        emitParticles(player.x, wy, 8, 0);
        SF_prevAir = false;
      }
      player.y = wy + player.size * 0.3;       // 钳回波面, 贴面随波微浮
      if (player.vy > -40) player.vy = 0;      // 只清缓速; 保留上冲积累供冲刺跃出
    }
  } else if (SF_prevAir){
    player.vy += 950 * dt;                     // 到期仍在空中: 继续下坠至落水
  }
}

// ==================== 海雪 (SN_) 悬浮微粒, 纯函数零状态, 相机环面回绕 ====================
function SN_draw(time){
  if (qLevel === 0) return;
  var TOR = 3400, TOH = 2300, z = cam.z;
  var vL = cam.x - W / (2 * z) - 80, vR = cam.x + W / (2 * z) + 80;
  var vT = cam.y - H / (2 * z) - 80, vB = cam.y + H / (2 * z) + 80;
  var i, x, y, wx, wy, r, a2, step = qLevel >= 2 ? 1 : 2;
  ctx.fillStyle = "#cfe8ef";
  for (i = 0; i < 52; i += step){
    x = Math.sin(i * 12.9898) * 1700 + Math.sin(time * 0.13 + i * 1.7) * 110 + Math.sin(i * 3.7) * 600 - cam.x;
    y = Math.cos(i * 78.233) * 1150 + time * (5 + (i % 5) * 3.2) + Math.cos(time * 0.4 + i * 2) * 46 - cam.y;
    x = x - Math.floor(x / TOR) * TOR;         // 回绕→永远铺满相机四周, 世界系固定
    y = y - Math.floor(y / TOH) * TOH;
    wx = cam.x + x - TOR / 2; wy = cam.y + y - TOH / 2;
    if (wx < vL || wx > vR || wy < vT || wy > vB) continue;
    r = 0.8 + (i % 4) * 0.55;
    a2 = 0.09 + (i % 7) * 0.026;
    ctx.globalAlpha = a2;
    ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ==================== SDF 岩体地形 (RK_) 曲面岩体+隧道+洞窟空穴, 全部真实碰撞 ====================
// 场定义: 岩体=球体集 smooth-min 有机融合(曲线地形); 洞穴=胶囊(隧道)/点球(空穴) 场减法。
// 场值 d<0 为岩体, d>0 可游动空间 → 隧道/空穴是真实的可游走廊与腔体。
var RK_list = [];
var RK_chambers = [];
var RUINS = [];
var RK_TINT = [[96, 112, 116], [98, 104, 120], [54, 72, 94], [80, 98, 112]];

function rkBake(rk){

function RK_draw(time){

  var vL = cam.x - W / (2 * z) - 80, vR = cam.x + W / (2 * z) + 80;
  var vT = cam.y - H / (2 * z) - 80, vB = cam.y + H / (2 * z) + 80;
  var i, rk;
  for (i = 0; i < RK_list.length; i++){
    rk = RK_list[i];
    if (rk.wx1 < vL || rk.wx0 > vR || rk.wy1 < vT || rk.wy0 > vB) continue;
    ctx.drawImage(rk.spr, rk.wx0, rk.wy0, rk.w, rk.h);
    if (rk.hang && qLevel > 0){
      // 悬浮岩礁垂藤: 锚定岩底随流轻摆(中层水体的依托植被)
      ctx.strokeStyle = "rgba(46,125,80,0.6)"; ctx.lineWidth = 4; ctx.lineCap = "round";
      for (var vv = 0; vv < 3; vv++){
        var vxa = rk.ax + rk.w * (0.25 + vv * 0.25), vya = rk.wy1 - 70 - (vv % 2) * 46;
        var sway2 = Math.sin(time * 0.7 + rk.ax * 0.011 + vv * 2) * 16;
        ctx.beginPath();
        ctx.moveTo(vxa, vya);
        ctx.quadraticCurveTo(vxa + sway2, vya + 120, vxa + sway2 * 1.6, vya + 220 + vv * 26);
        ctx.stroke();
      }
    }
  }
  for (i = 0; i < RUINS.length; i++){
    var ru = RUINS[i];
    if (ru.x < vL - 400 || ru.x > vR + 400 || ru.y < vT - 300 || ru.y > vB + 300) continue;
    ctx.drawImage(ru.spr, ru.x - ru.spr.width / 2 * ru.s, ru.y - ru.spr.height * ru.s, ru.spr.width * ru.s, ru.spr.height * ru.s);
  }
}

// 左右岩石峭壁(半分辨率烘焙, 含向内暗化过渡+攀壁海藻+深渊发光植物)
function bakeCliff(left){
  var CW = 230, CH = Math.ceil(CONF.WORLD_H / 2);
  var c = newCanvas(CW, CH), g = c.getContext("2d");
  var pts = [];
  for (var y = 0; y <= CH; y += 30){
    var inn = 118 + Math.sin(y * 0.008 + (left ? 0 : 3.1)) * 26 + Math.sin(y * 0.025 + 1) * 14 + Math.sin(y * 0.11) * 5;
    if (inn > CW - 8) inn = CW - 8;
    pts.push(inn);
  }
  var grd = g.createLinearGradient(left ? 0 : CW, 0, left ? CW : 0, 0);
  grd.addColorStop(0, "#04080f");
  grd.addColorStop(0.7, "#0c1826");
  grd.addColorStop(1, "rgba(12,24,38,0)");
  g.fillStyle = grd;
  g.beginPath();
  g.moveTo(left ? 0 : CW, 0);
  var pI0 = left ? pts[0] : CW - pts[0];
  g.lineTo(pI0, 0);
  for (var p = 1; p < pts.length; p++){
    var xA = left ? pts[p - 1] : CW - pts[p - 1];
    var xB = left ? pts[p] : CW - pts[p];
    g.quadraticCurveTo(xA, (p - 1) * 30, (xA + xB) / 2, (p - 0.5) * 30);
  }
  var xE = left ? pts[pts.length - 1] : CW - pts[pts.length - 1];
  g.lineTo(xE, CH);
  g.lineTo(left ? 0 : CW, CH);
  g.closePath(); g.fill();
  // 内缘受光棱线
  g.strokeStyle = "rgba(96,150,180,0.22)"; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(pI0, 0);
  for (var p2 = 1; p2 < pts.length; p2++){
    var xA2 = left ? pts[p2 - 1] : CW - pts[p2 - 1];
    var xB2 = left ? pts[p2] : CW - pts[p2];
    g.quadraticCurveTo(xA2, (p2 - 1) * 30, (xA2 + xB2) / 2, (p2 - 0.5) * 30);
  }
  g.stroke();
  // 攀壁海藻 + 深渊段发光植物
  g.lineCap = "round";
  for (var d = 0; d < 60; d++){
    var yy = rand(40, CH - 40);
    var idx = Math.floor(yy / 30); if (idx >= pts.length) idx = pts.length - 1;
    var edge = left ? pts[idx] : CW - pts[idx];
    var xx = edge + (left ? rand(-14, 18) : rand(-18, 14));
    if (yy > CH * 0.45 && d % 3 === 0){
      var gg = g.createRadialGradient(xx, yy, 2, xx, yy, 20);
      gg.addColorStop(0, "rgba(110,255,220,0.45)"); gg.addColorStop(1, "rgba(110,255,220,0)");
      g.fillStyle = gg; g.beginPath(); g.arc(xx, yy, 20, 0, Math.PI * 2); g.fill();
    } else {
      g.strokeStyle = "rgba(28,86,76,0.55)"; g.lineWidth = 3;
      g.beginPath(); g.moveTo(xx, yy);
      g.quadraticCurveTo(xx + (left ? 16 : -16), yy - 18, xx + (left ? 6 : -6), yy - 38);
      g.stroke();
    }
  }
  return c;
}

var GRID_CELL = 240, GRID_MX = 620, GRID_MY = 620;
var gridCols = 0, gridRows = 0, gridCells = null;
var nearbyScratch = []; // 共享单缓冲: 只允许 updateFish 一处消费, 勿嵌套查询
function gridInit(){
  gridCols = Math.ceil((CONF.WORLD_W + GRID_MX * 2) / GRID_CELL);
  gridRows = Math.ceil((CONF.WORLD_H + GRID_MY * 2) / GRID_CELL);
  gridCells = new Array(gridCols * gridRows);
  for (var i = 0; i < gridCells.length; i++) gridCells[i] = [];
}
function gridClear(){
  for (var i = 0; i < gridCells.length; i++) if (gridCells[i].length) gridCells[i].length = 0;
}
function gridInsert(f){
  var cx = clamp(Math.floor((f.x + GRID_MX) / GRID_CELL), 0, gridCols - 1);
  var cy = clamp(Math.floor((f.y + GRID_MY) / GRID_CELL), 0, gridRows - 1);
  gridCells[cy * gridCols + cx].push(f);
}
function queryNearby(x, y, r){
  nearbyScratch.length = 0;
  var x0 = clamp(Math.floor((x - r + GRID_MX) / GRID_CELL), 0, gridCols - 1);
  var x1 = clamp(Math.floor((x + r + GRID_MX) / GRID_CELL), 0, gridCols - 1);
  var y0 = clamp(Math.floor((y - r + GRID_MY) / GRID_CELL), 0, gridRows - 1);
  var y1 = clamp(Math.floor((y + r + GRID_MY) / GRID_CELL), 0, gridRows - 1);
  for (var cy = y0; cy <= y1; cy++){
    var rowBase = cy * gridCols;
    for (var cx = x0; cx <= x1; cx++){
      var cell = gridCells[rowBase + cx];
      for (var k = 0; k < cell.length; k++) nearbyScratch.push(cell[k]);
    }
  }
  return nearbyScratch.length;
}

function newFish(){
  return {
    specIdx: 0, spec: SPECIES[0], size: 10,
    x: 0, y: 0, vx: 0, vy: 0, angle: 0, tailPhase: 0,
    hunger: 70, state: "wander", fleeTimer: 0,
    aggroTimer: 0, aggroCd: 0, turnTimer: 0, turnInterval: 2,
    biome: 0, dead: false, inflated: 0, born: -10, lungeT: 0, hx: 0, hy: 0
  };
}
function aliveTierCount(t){
  var n = 0;
  for (var i = 0; i < fishes.length; i++) if (!fishes[i].dead && tierOf(fishes[i].spec) === t) n++;
  return n;
}
function pickSpecies(biome, forceSmall){
  var i, tries = 6;
  while (tries-- > 0){
    var total = 0, sp2;
    for (i = 0; i < SPECIES.length; i++) total += SPECIES[i].bio[biome];
    var roll = Math.random() * total, acc = 0, picked = SPECIES[0];
    for (i = 0; i < SPECIES.length; i++){
      acc += SPECIES[i].bio[biome];
      if (roll <= acc){ picked = SPECIES[i]; break; }
    }
    if (forceSmall && tierOf(picked) > 0){
      // 强制小鱼: 从 tier0 里挑一个在该群系有分布的
      var smalls = [];
      for (i = 0; i < SPECIES.length; i++) if (tierOf(SPECIES[i]) === 0 && SPECIES[i].bio[biome] > 0) smalls.push(SPECIES[i]);
      picked = smalls.length ? smalls[Math.floor(Math.random() * smalls.length)] : SPECIES[0];
    }
    var t = tierOf(picked);
    if (t === 0 || aliveTierCount(t) < TIER_CAP[t]) return picked;
  }
  return SPECIES[Math.floor(Math.random() * 4)]; // 兜底: 小鱼
}
function spawnFish(avoidPlayer){
  // 挑缺员的海域
  var counts = [0, 0, 0, 0];
  var i;
  for (i = 0; i < fishes.length; i++) if (!fishes[i].dead) counts[fishes[i].biome]++;
  var weights = [0, 0, 0, 0], wTotal = 0;
  var targets = [38, 38, 40, 44]; // 总额 160, 流送式围绕玩家补员
  for (i = 0; i < 4; i++){ weights[i] = Math.max(1, targets[i] - counts[i]); wTotal += weights[i]; }
  var roll = Math.random() * wTotal, zone = 0;
  for (i = 0; i < 4; i++){ roll -= weights[i]; if (roll <= 0){ zone = i; break; } }

  // 玩家附近的威胁数量限制(防止后期被大鱼围死)
  var dangerNear = 0;
  for (i = 0; i < fishes.length; i++){
    var f2 = fishes[i];
    if (f2.dead) continue;
    if (f2.size > player.size * CONF.KILL_RATIO && dist2(f2.x, f2.y, player.x, player.y) < 1100 * 1100) dangerNear++;
  }
  var forceSmall = dangerNear >= 6;

  // 动态流送取点: 围绕玩家环带生成(屏外潜入, 屏内永远有鱼)
  var px = 0, py = 0, ok = false;
  for (var t2 = 0; t2 < 14; t2++){
    var sa = rand(0, Math.PI * 2), sr = rand(Math.max(740, Math.hypot(W,H) / (2 * Math.max(cam.z,0.15)) + 130), 2300);
    px = clamp(player.x + Math.cos(sa) * sr, 140, CONF.WORLD_W - 140);
    py = clamp(player.y + Math.sin(sa) * sr * 0.85, 140, floorAt(px) - 120);
    if (py < 140) py = 140;
    if (rkInside(px, py, 26)) continue;
    var relaxed = t2 >= 6;
    if (zoneAt(px, py) === zone || relaxed){ ok = true; break; }
  }
  if (!ok) return; // 本轮放弃, 下个 tick 再试

  var sp = pickSpecies(zone, forceSmall);
  // 地标生态偏好: 沉船→鲨鱼/石斑鱼, 热泉→鮟鱇/海鳗(仅当地标在玩家 3000 内, 否则保持环带点防秒回收)
  if (zone === 3 && WRECK && Math.random() < 0.35 && (sp.n === "鲨鱼" || sp.n === "石斑鱼") && dist2(WRECK.x, 0, player.x, 0) < 3000 * 3000){
    var wx2 = clamp(WRECK.x + rand(-400, 400), 200, CONF.WORLD_W - 200);
    var wy2 = floorAt(wx2) - rand(80, 420);
    if (dist2(wx2, wy2, player.x, player.y) > 900 * 900){ px = wx2; py = wy2; }
  }
  if (zone === 2 && VENTS.length && Math.random() < 0.35 && (sp.n === "鮟鱇鱼" || sp.n === "海鳗")){
    var vt2 = VENTS[Math.floor(Math.random() * VENTS.length)];
    var vx2 = clamp(vt2.x + rand(-260, 260), 200, CONF.WORLD_W - 200);
    var vy2 = floorAt(vx2) - rand(60, 320);
    if (dist2(vx2, vy2, player.x, player.y) > 900 * 900){ px = vx2; py = vy2; }
  }
  if (zone === 3 && px > 7800 && px < 12200 && Math.random() < 0.5 && tierOf(sp) > 0){
    sp = pickSpecies(3, true); // 海藻林: 小鱼加倍
  }
  var f = fishPool.length ? fishPool.pop() : newFish();
  var size = rand(sp.sMin, sp.sMax);
  // 后期: 巨鱼随玩家体型放大, 保持威胁与张力
  if (tierOf(sp) === 3 && player.size > 90) size *= Math.min(1.6, 1 + (player.size - 90) / 100);

  f.specIdx = SPECIES.indexOf(sp); f.spec = sp;
  f.size = size; f.x = px; f.y = py;
  f.vx = 0; f.vy = 0;
  f.angle = Math.atan2(CONF.WORLD_H / 2 - py, CONF.WORLD_W / 2 - px) + rand(-0.6, 0.6);
  f.tailPhase = Math.random() * Math.PI * 2;
  f.hunger = rand(55, 90);
  f.state = "wander"; f.fleeTimer = 0; f.lungeT = 0; f.huntT = 0; f.huntCd = rand(0, 6);
  f.aggroTimer = 0; f.aggroCd = rand(0, 4);
  f.turnTimer = 0; f.turnInterval = rand(1, 3.5);
  f.biome = zoneAt(px, py); f.dead = false; f.inflated = 0; f.born = survivalTime;
  f.hx = px; f.hy = py;
  fishes.push(f);
}

function spawnMermaid(){

function playerBitten(f){

function updateFish(f, dt){
  var sp = f.spec;
  if(window.updatePufferDefense&&sp.shape==="puff")updatePufferDefense(f,dt);
  f.lungeCooldown=Math.max(0,(f.lungeCooldown||0)-dt);
  // 饥饿
  if (f.state === "rest") f.hunger += 2.2 * dt;
  else f.hunger -= 1.1 * dt;
  f.hunger = clamp(f.hunger, 0, 100);
  if (f.aggroCd > 0) f.aggroCd -= dt;
  if (f.aggroTimer > 0) f.aggroTimer -= dt;

  // 巢区回归(以出生点为家, 超出半径游回)
  var hd2 = dist2(f.x, f.y, f.hx, f.hy);
  var farHome = hd2 > 620 * 620;
  if (farHome && f.state !== "flee"){
    var ca = Math.atan2(f.hy - f.y, f.hx - f.x);
    f.angle = lerpAngle(f.angle, ca, Math.min(1, dt * 1.8));
  }

  // 邻域扫描
  var threat = null, tD2 = 1e18, prey = null, pD2 = 1e18;
  var schN = 0, schX = 0, schY = 0; // 同种集群 accumulator(零分配)
  var n = queryNearby(f.x, f.y, 400);
  var k, o, d2v;
  for (k = 0; k < n; k++){
    o = nearbyScratch[k];
    if (o === f || o.dead) continue;
    d2v = dist2(f.x, f.y, o.x, o.y);
    if (o.size > f.size * CONF.KILL_RATIO){ if (d2v < tD2){ tD2 = d2v; threat = o; } }
    else if (o.size < f.size * CONF.EAT_RATIO && !o.puffBlocked){ if (d2v < pD2){ pD2 = d2v; prey = o; } }
    else if (o.spec === sp && tierOf(sp) < 2){ schN++; schX += o.x; schY += o.y; }
  }
  // 玩家关系
  var pIsThreat = player.alive && player.size > f.size * CONF.KILL_RATIO;
  var pIsPrey = player.alive && player.spawnProt <= 0 && player.size < f.size * CONF.EAT_RATIO;
  var pd2 = dist2(f.x, f.y, player.x, player.y);
  if (pIsThreat && pd2 < tD2){ tD2 = pd2; threat = player; }
  var aggroR = (520 + 340 * (1 - cameraLogicalZoom() / 1.45)) * (window.fishSenseFactor ? fishSenseFactor(f) : 1);
  var canChasePlayer = window.playerPursuit ? playerPursuit(f, pIsPrey, aggroR, dt) : false;
  f.chasingPlayer=false;f.targetKind=null;
  // 猎杀: 明显大于玩家的凶猛鱼主动锁定追击(咬一口掉体型, 小到能吞才整吞)
  var canHunt = false;
  if (f.huntCd > 0) f.huntCd -= dt;
  if (f.huntT > 0){
    if (!f.returningHome && player.alive && player.spawnProt<=0 && !(f.playerChaseCooldown>0) && pd2 < 1250 * 1250 && (!window.fishCanSeePlayer || fishCanSeePlayer(f))){ canHunt = true; f.huntT -= dt; }
    else { f.huntT = 0; f.huntCd = 6; }
  } else if (!f.returningHome && sp.aggr && player.alive && player.spawnProt <= 0 && player.size > 26 &&
             f.size > player.size * 1.12 && f.huntCd <= 0 && !(f.playerChaseCooldown>0) && huntCount < 2 && pd2 < 760 * 760 && (!window.fishCanSeePlayer || fishCanSeePlayer(f))){
    f.huntT = 7 + Math.random() * 3; huntCount++; canHunt = true;
  }

  var desiredX = 0, desiredY = 0, spdMul = 0.7;
  // 逃跑优先
  var fleeR = threat ? 150 + threat.size * 1.9 : 0;
  if (threat && tD2 < fleeR * fleeR){
    f.state = "flee"; f.fleeTimer = 0.35;
    var fa = Math.atan2(f.y - threat.y, f.x - threat.x) + rand(-0.4, 0.4);
    desiredX = Math.cos(fa); desiredY = Math.sin(fa);
    spdMul = 1.75;

  } else {
    if (sp.shape !== "puff" && f.inflated > 0) f.inflated = Math.max(0, f.inflated - dt * 1.5);
    if (f.state === "flee"){
      f.fleeTimer -= dt;
      if (f.fleeTimer <= 0) f.state = f.hunger > 45 ? "chase" : "wander";
    }
    if (f.state !== "flee"){
      if (f.hunger < 20 && !canHunt && !canChasePlayer){ f.state = "rest"; }
      else if (canChasePlayer || canHunt || (f.hunger > 45 && prey && pD2 < 380 * 380)){
        f.state = "chase";
        var tx, ty;
        var wantPlayer = canChasePlayer || canHunt;
        f.chasingPlayer=wantPlayer;f.targetKind=wantPlayer?"player":"fish";
        if (wantPlayer){ if (canChasePlayer) f.aggroTimer = 5; tx = canChasePlayer ? f.playerTrackX : player.x; ty = canChasePlayer ? f.playerTrackY : player.y; }
        else if (prey){ tx = prey.x; ty = prey.y; }
        else { tx = null; }
        if (tx !== null){
          var pa = Math.atan2(ty - f.y, tx - f.x);
          desiredX = Math.cos(pa); desiredY = Math.sin(pa);
          spdMul = wantPlayer && window.fishChaseMultiplier ? fishChaseMultiplier(f) : 1.02;
          // 突进扑咬(鲨鱼/剑鱼/梭鱼/鮟鱇)
          if (sp.aggr){
            if (f.lungeT > 0){ f.lungeT -= dt; spdMul *= 1.45; }
            else if (f.lungeCooldown<=0 && pd2 < 340 * 340 && Math.random() < dt * (canHunt ? 1.1 : 0.5)){ f.lungeT = 0.75; f.lungeCooldown=4.5; emitRipple(f.x, f.y, f.size * 1.6); }
          }
        }
        // 追击接触→吞食
        if (!wantPlayer && prey && !prey.puffBlocked && pD2 < Math.pow((f.size + prey.size) * 0.42, 2) && f.hunger > 50){
          aiEatFish(f, prey);
          prey = null;
        }
        // 追击玩家接触→咬
        if ((canChasePlayer || canHunt) && pd2 < Math.pow((f.size * 0.45 + player.size * 0.45), 2)){
          if (player.invulnTimer > 0 || player.spawnProt > 0) { /* 无敌 */ }
          else if (player.buffs.shield > 0){ consumeShield(f); f.huntT = 0; f.huntCd = 8; }
          else if (player.size < f.size * 0.62){ playerDie("被" + sp.n + "吞掉了"); return; }
          else {
            playerBitten(f);
            f.huntT = 0; f.huntCd = 9;
          }
        }
      } else {
        if (f.state === "chase") f.state = "wander";
        // 漫游
        f.turnTimer += dt;
        if (f.turnTimer >= f.turnInterval){
          f.turnTimer = 0;
          f.turnInterval = rand(1.2, 3.6);
          f.wanderA = f.angle + rand(-0.9, 0.9);
        }
        var wa = f.wanderA === undefined ? f.angle : f.wanderA;
        desiredX = Math.cos(wa); desiredY = Math.sin(wa);
        spdMul = f.state === "rest" ? 0.35 : 0.7;
        // 集群: 小鱼对同种中心弱吸引(松散鱼群感)
        if (schN > 0){
          var fx2 = schX / schN - f.x, fy2 = schY / schN - f.y;
          var fl2 = Math.sqrt(fx2 * fx2 + fy2 * fy2);
          if (fl2 > 60){
            desiredX = desiredX * 0.62 + (fx2 / fl2) * 0.38;
            desiredY = desiredY * 0.62 + (fy2 / fl2) * 0.38;
          }
        }
        // 偶发小冲刺, 增加生命感
        if (f.lungeT > 0){ f.lungeT -= dt; spdMul *= 1.5; }
        else if (Math.random() < dt * 0.1) f.lungeT = 0.5;
      }
    }
  }
  if (f.aggroTimer > 0 && !canChasePlayer){ f.aggroTimer = 0; f.aggroCd = 4.5; }

  if (farHome && f.state !== "flee" && f.state !== "chase"){
    var homeDist=Math.sqrt(hd2)||1;desiredX=desiredX*.15+(f.hx-f.x)/homeDist*.85;desiredY=desiredY*.15+(f.hy-f.y)/homeDist*.85;
  }
  if(window.fishSpacingSteer){var spaced=fishSpacingSteer(f,desiredX,desiredY);desiredX=spaced.x;desiredY=spaced.y;}
  if(window.ecologySteering){var eco=ecologySteering(f,desiredX,desiredY);desiredX=eco.x;desiredY=eco.y;}
  if (window.steerAroundTerrain) steerAroundTerrain(f, desiredX, desiredY, dt);
  if (f.terrainSteer){desiredX=f.terrainSteer.x;desiredY=f.terrainSteer.y;}
  // 速度积分
  var maxSpd = sp.spd * spdMul * motionScale * (window.fishDepthSpeed ? fishDepthSpeed(f) : 1);
  if(sp.shape==="puff"&&f.puffBlocked)maxSpd*=.35;
  var dvx = desiredX * maxSpd, dvy = desiredY * maxSpd;
  var rate = Math.min(1, dt * 3);
  f.vx += (dvx - f.vx) * rate;
  f.vy += (dvy - f.vy) * rate;
  var cur2 = f.vx * f.vx + f.vy * f.vy;
  if (cur2 > maxSpd * maxSpd){
    var cs = Math.sqrt(cur2);
    f.vx = f.vx / cs * maxSpd; f.vy = f.vy / cs * maxSpd;
    cur2 = maxSpd * maxSpd;
  }
  f.x += f.vx * dt; f.y += f.vy * dt;
  // 世界边界(贴左右峭壁面)
  if (f.x < 130){ f.x = 130; f.vx = Math.abs(f.vx); }
  if (f.x > CONF.WORLD_W - 130){ f.x = CONF.WORLD_W - 130; f.vx = -Math.abs(f.vx); }
  if (f.y < 30){ f.y = 30; f.vy = Math.abs(f.vy); }
  if (f.y > CONF.WORLD_H - 30){ f.y = CONF.WORLD_H - 30; f.vy = -Math.abs(f.vy); }
  // 热泉暖流托举鱼
  var vlf = ventLift(f.x, f.y, survivalTime);
  if (vlf > 0){ f.vy -= 260 * vlf * dt; f.y -= 70 * vlf * dt; }
  // 不钻进海床
  var flY = floorAt(f.x);
  if (f.y > flY - f.size * 0.25){ f.y = flY - f.size * 0.25; if (f.vy > 0) f.vy = -Math.abs(f.vy) * 0.4; }
  rkCollide(f, false);

  var curSpd = Math.sqrt(cur2);
  if (curSpd > 8) f.angle = lerpAngle(f.angle, Math.atan2(f.vy, f.vx), Math.min(1, dt * 6));
  f.tailPhase += dt * (5 + curSpd * 0.12);

  // 离群回收(在视野外且远离老家)
  {
    var halfW2 = W / (2 * cam.z) + 200, halfH2 = H / (2 * cam.z) + 200;
    var offscreen = f.x < cam.x - halfW2 || f.x > cam.x + halfW2 || f.y < cam.y - halfH2 || f.y > cam.y + halfH2;
    if (offscreen && hd2 > 1500 * 1500 && canRecycleFish(f)) f.dead = true; // 由 sweep 回收并补刷
  }

  if(sp.shape==="puff"&&window.handlePufferContact){handlePufferContact(f);return;}
  if(sp.shape==="sword" && handleSwordContact(f))return;
  // 玩家接触(吃或被吃)
  if (player.alive && gameState === "playing"){
    var rr2 = (f.size + player.size) * 0.45;
    if (pd2 < rr2 * rr2){
      if (f.size < player.size * CONF.EAT_RATIO){

        }
      }
    }
  }
}

// ==================== 主更新 ====================
var mouseSX = 0, mouseSY = 0, sprintPointer = false, touchCount = 0;
var keys = {};
function update(dt){
  if (gameState !== "playing") return;
  qualityTick(dt);
  survivalTime += dt;

  // ---- 玩家 ----
  // 输入目标(世界坐标)
  var wx = (mouseSX - W / 2) / cam.z + cam.x;
  var wy = (mouseSY - H / 2) / cam.z + cam.y;
  var kdx = 0, kdy = 0;
  if (keys.KeyA || keys.ArrowLeft) kdx -= 1;
  if (keys.KeyD || keys.ArrowRight) kdx += 1;
  if (keys.KeyW || keys.ArrowUp) kdy -= 1;
  if (keys.KeyS || keys.ArrowDown) kdy += 1;
  var sprint = advanceSprint(dt, !!(sprintPointer || (window.MOBILE_INPUT && MOBILE_INPUT.dash) || keys.ShiftLeft || keys.ShiftRight));
  var useKeys = (kdx !== 0 || kdy !== 0);

  motionScale = clamp(Math.pow(1 / cameraLogicalZoom(), 0.7), 1, 1.8);
  var maxSpd = (CONF.P_BASE_SPD + player.size * CONF.P_SPD_PER_SIZE) * motionScale;
  if (player.buffs.speed > 0) maxSpd *= 1.42;
  if (sprint) maxSpd *= CONF.SPRINT_MULT;
  if (player.hunger < CONF.HUNGER_LOW) maxSpd *= CONF.LOW_SLOW;
  if (player.slowTimer > 0) maxSpd *= 0.75;

  if(window.oceanSpeedFactor)maxSpd*=oceanSpeedFactor(player.x,player.y);
  var dirX = 0, dirY = 0;
  if (window.MOBILE_INPUT && MOBILE_INPUT.enabled && !useKeys){
    dirX = MOBILE_INPUT.x; dirY = MOBILE_INPUT.y;
  } else if (useKeys){
    var kl = Math.sqrt(kdx * kdx + kdy * kdy);
    dirX = kdx / kl; dirY = kdy / kl;
  } else {
    var dx = wx - player.x, dy = wy - player.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > 4){
      var arrive = d < CONF.ARRIVE_R ? d / CONF.ARRIVE_R : 1;
      dirX = dx / d * arrive; dirY = dy / d * arrive;
    }
  }
  var rate = Math.min(1, dt * CONF.P_STEER);
  if(player.surfaceFlight){player.vx=player.vx*Math.exp(-.12*dt)+dirX*30*dt;player.vy+=SURFACE_GRAVITY*dt;}
  else{player.vx += (dirX * maxSpd - player.vx) * rate;player.vy += (dirY * maxSpd - player.vy) * rate;}
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  if(window.applyOceanCurrents)applyOceanCurrents(player,dt);
  var m2 = player.size;
  player.x = clamp(player.x, m2 + 130, CONF.WORLD_W - m2 - 130);
  player.y = clamp(player.y, -1600, CONF.WORLD_H - m2);
  // 热泉暖流托举玩家
  var vl = ventLift(player.x, player.y, survivalTime);
  if (vl > 0){ player.vy -= 300 * vl * dt; player.y -= 90 * vl * dt; }
  var pFl = floorAt(player.x);
  if (player.y > pFl - m2 * 0.4) player.y = pFl - m2 * 0.4;
  rkCollide(player, true);
  SF_updateSurface(dt);
  var pv = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  if (pv > 20) player.angle = lerpAngle(player.angle, Math.atan2(player.vy, player.vx), Math.min(1, dt * 8));
  player.tailPhase += dt * (6 + pv * 0.09);

  // 饥饿
  var drain = CONF.HUNGER_DRAIN * (sprint && pv > maxSpd * 0.45 ? CONF.SPRINT_HUNGER : 1);
  player.hunger -= drain * dt;
  if (player.hunger <= 0){
    player.hunger = 0;
    player.starving = true;
    score = Math.max(0, score - 4 * dt);
    player.shrinkAcc += dt;
    if (player.shrinkAcc >= CONF.SHRINK_INT){
      player.shrinkAcc = 0;
      player.size = Math.max(CONF.P_INIT_SIZE, player.size * (1 - CONF.SHRINK_RATE));
    }
    if (player.size <= CONF.P_INIT_SIZE + 0.5){
      player.starveAcc += dt;
      if (player.starveAcc >= CONF.STARVE_DEATH){ playerDie("饿得游不动了"); return; }
    }
  } else {
    if (player.hunger > 25) player.starving = false;
    player.starveAcc = 0;
  }
  player.hungerShow += (player.hunger - player.hungerShow) * Math.min(1, dt * 5);

  // 计时器
  if (player.spawnProt > 0) player.spawnProt -= dt;
  if (player.invulnTimer > 0) player.invulnTimer -= dt;
  if (player.slowTimer > 0) player.slowTimer -= dt;
  if (player.gulp > 0) player.gulp -= dt * 1.6;
  if (player.shieldFlash > 0) player.shieldFlash -= dt;
  if (player.hurtFlash > 0) player.hurtFlash -= dt;
  var bk;
  for (bk in player.buffs) if (player.buffs[bk] > 0) player.buffs[bk] -= dt;
  if (comboTimer > 0){ comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // 远景鱼群漂移(背景生命感)
  FF_update(dt);

  // ---- 活水层(LOD): 只模拟玩家周围一圈的鱼, 远处冻结省 AI/网格开销 ----
  var actR = Math.max(1750, Math.sqrt(W * W + H * H) / (2 * cam.z) + 1100);
  var actR2 = actR * actR;
  gridClear();
  var i;
  huntCount = 0;
  for (i = 0; i < fishes.length; i++){
    var fg = fishes[i];
    var fd2 = dist2(fg.x, fg.y, player.x, player.y);
    if(!fg.dead&&fd2<Math.pow(Math.hypot(W,H)/(2*cam.z)+300,2))fg.lastPlayerEncounter=survivalTime;
    fg._act = !fg.dead && (fd2 <= actR2 || ((fg.chasingPlayer||fg.state==="flee")&&survivalTime-(fg.lastPlayerEncounter===undefined?-100:fg.lastPlayerEncounter)<20&&fd2<Math.pow(fishRetentionRadius(),2)));
    if (fg._act){ gridInsert(fg); if (fg.huntT > 0) huntCount++; }
    else if (!fg.dead && canRecycleFish(fg)){
      fg.dead = true; // 动态加载: 游离太远的鱼回收, 由流送环带再生
    }
  }

  // ---- 鱼更新 ----
  for (i = 0; i < fishes.length; i++){
    var f = fishes[i];
    if (!f._act) continue;
    updateFish(f, dt);
    if (gameState !== "playing") return; // 玩家死亡
  }
  // 清尸
  for (i = fishes.length - 1; i >= 0; i--){
    if (fishes[i].dead){
      fishPool.push(fishes[i]);
      fishes[i] = fishes[fishes.length - 1];
      fishes.pop();
    }
  }

  // ---- 食物 ----
  updateFoods(dt);
  foodRespawnUpdate(dt);
  updateMermaid(dt);
  if (gameState !== "playing") return;

  // ---- 种群 ----
  populationUpdate(dt);

  // ---- 粒子/涟漪/飘字 ----
  for (i = 0; i < particles.length; i++){
    var pp2 = particles[i];
    if (!pp2.active) continue;
    pp2.life += dt;
    if (pp2.life >= pp2.maxLife){ pp2.active = false; continue; }
    pp2.x += pp2.vx * dt; pp2.y += pp2.vy * dt;
    pp2.vx *= 0.96; pp2.vy *= 0.96;
  }
  for (i = 0; i < ripples.length; i++){
    var r2 = ripples[i];
    if (!r2.active) continue;
    r2.life += dt;
    if (r2.life >= r2.maxLife){ r2.active = false; continue; }
    r2.r = r2.maxR * (r2.life / r2.maxLife);
  }
  for (i = 0; i < popups.length; i++){
    var pu = popups[i];
    if (!pu.active) continue;
    pu.life += dt;
    pu.y -= 34 * dt;
    if (pu.life >= pu.maxLife) pu.active = false;
  }
  // 气泡维护
  var bubbleTarget = QBUB[qLevel];
  var bubbleAlive = 0;
  for (i = 0; i < bubbles.length; i++){
    var bbl = bubbles[i];
    if (!bbl.active) continue;
    bbl.y -= bbl.spd * dt;
    bbl.x += Math.sin(bbl.drift += bbl.ds * dt) * 0.5;
    if (bbl.y < cam.y - H / (2 * cam.z) - 40 || bbl.y > cam.y + H / (2 * cam.z) + 80 || bbl.x < cam.x - W / (2 * cam.z) - 60 || bbl.x > cam.x + W / (2 * cam.z) + 60){
      bbl.active = false;
      continue;
    }
    bubbleAlive++;
  }
  if (bubbleAlive < bubbleTarget && Math.random() < 0.4) spawnBubble();
  // 地标气泡: 沉船泄露 + 热泉喷发
  if (Math.random() < dt * 3){
    var emX = 0, emY = 0, emS = 0, got = false;
    if (WRECK && Math.abs(WRECK.x - cam.x) < W / (2 * cam.z) + 300){
      emX = WRECK.x + rand(-90, 90); emY = WRECK.y - 40; emS = 60; got = true;
    } else {
      for (var ve = 0; ve < VENTS.length; ve++){
        var vv = VENTS[ve];
        if (Math.abs(vv.x - cam.x) < W / (2 * cam.z) + 200 && ventLift(vv.x, vv.y - 30, survivalTime) > 0.2){
          emX = vv.x + rand(-40, 40); emY = vv.y - 30; emS = 130; got = true; break;
        }
      }
    }
    if (got){
      for (var be = 0; be < bubbles.length; be++){
        var bb3 = bubbles[be];
        if (bb3.active) continue;
        bb3.active = true; bb3.type = 0; bb3.x = emX; bb3.y = emY;
        bb3.r = rand(1.5, 4); bb3.spd = emS * rand(0.8, 1.3);
        bb3.drift = Math.random() * 6; bb3.ds = rand(0.6, 2);
        break;
      }
    }
  }

  // ---- 摄像机 ----
  var desiredZoom = clamp(50 / player.size, CONF.ZOOM_MIN, window.oceanZoomCap ? oceanZoomCap() : CONF.ZOOM_MAX) * (1 + 0.1 * Math.max(0, zoomPulse)) * cameraViewportScale();
  cam.z += (desiredZoom - cam.z) * Math.min(1, dt * 2.2);
  var ctx2 = player.x + player.vx * 0.22, cty = player.y + player.vy * 0.22;
  cam.x += (ctx2 - cam.x) * Math.min(1, dt * 5.5);
  cam.y += (cty - cam.y) * Math.min(1, dt * 5.5);
  var halfW = W / (2 * cam.z), halfH = H / (2 * cam.z);
  if (halfW * 2 >= CONF.WORLD_W) cam.x = CONF.WORLD_W / 2;
  else cam.x = clamp(cam.x, halfW, CONF.WORLD_W - halfW);
  if (halfH * 2 >= CONF.WORLD_H) cam.y = CONF.WORLD_H / 2;
  else cam.y = clamp(cam.y, halfH - 280, CONF.WORLD_H - halfH); // 近水面时抬头看天空

  // 群系横幅
  var curBiome = zoneAt(player.x, player.y);
  if (curBiome !== lastBiome){
    lastBiome = curBiome;
    banner("进入 " + ZONES[curBiome].name);
  }

  // 调试钩子
  if (!update._acc) update._acc = 0;
  update._acc += dt;
  if (update._acc > 0.5){
    update._acc = 0;
    window.__DBG = { fps: Math.round(1 / Math.max(frameEMA, 0.001)), fish: fishes.length, foods: foods.length, q: qLevel, dpr: DPR, score: Math.floor(score), ps: Math.round(player.size) };
  }
}
var lastBiome = -1;

function updateFoods(dt){
  var i;
  for (i = foods.length - 1; i >= 0; i--){
    var f = foods[i];
    f.t += dt;
    if (f.life > 0){
      f.life -= dt;
      if (f.life <= 0){ f.dead = true; }
    }
    if (f.dead){
      foodPool.push(f);
      foods[i] = foods[foods.length - 1];
      foods.pop();
      continue;
    }
    var foodDistance = dist2(f.x, f.y, player.x, player.y);
    if ((f.type === "shrimp" || f.type === "jelly") && foodDistance > 3500 * 3500){f.dead=true;continue;}
    var foodActiveRadius = Math.max(2200, Math.hypot(W,H)/(2*cam.z)+400);
    if (foodDistance > foodActiveRadius * foodActiveRadius) continue;
    // 行为
    if (f.type === "shrimp"){
      swimShrimp(f, dt);
    } else if (f.type === "jelly"){
      f.y -= 14 * dt;
      f.x += Math.sin(f.t * 1.2 + f.seed) * 12 * dt;
      if (f.stingCd > 0) f.stingCd -= dt;
      var fl3 = floorAt(f.x);
      if (f.y < 70) f.y = fl3 - 60;
      if (f.y > fl3 - 24) f.y = fl3 - 24;
    } else if (f.type === "crab"){
      // 螃蟹沿海床横行, 玩家靠近就疾跑
      f.turnT -= dt;
      if (f.turnT <= 0){ f.turnT = rand(1.5, 4); if (Math.random() < 0.6) f.dir = -f.dir; }
      if (player.alive && Math.sqrt(dist2(f.x, f.y, player.x, player.y)) < 230){
        f.dartT = 0.9; f.dir = (f.x < player.x ? -1 : 1);
      }
      var cspd = f.dartT > 0 ? 155 : 44;
      if (f.dartT > 0) f.dartT -= dt;
      f.x += f.dir * cspd * dt;
      if (f.x < 60){ f.x = 60; f.dir = 1; }
      if (f.x > CONF.WORLD_W - 60){ f.x = CONF.WORLD_W - 60; f.dir = -1; }
      f.y = (window.oceanFoodFloor?oceanFoodFloor(f):floorAt(f.x)) - 10 + Math.sin(f.t * 9) * 1.5;
    } else if (f.type === "star"){
      f.y += Math.sin(f.t * 2 + f.seed) * 6 * dt;
    }
    if (f.type === "crab" || f.type === "shrimp"){
      var foodBody={x:f.x,y:f.y,size:f.r,vx:0,vy:0};
      rkCollide(foodBody,false);f.x=foodBody.x;f.y=foodBody.y;
    }
    // 磁铁
    if (player.alive && player.buffs.magnet > 0 && f.type !== "jelly" && f.type !== "toxicjelly"){
      var d2v = dist2(f.x, f.y, player.x, player.y);
      if (d2v < 300 * 300){
        var d = Math.sqrt(d2v) || 1;
        f.x += (player.x - f.x) / d * 340 * dt;
        f.y += (player.y - f.y) / d * 340 * dt;
      }
    }
    // 采集
    if (player.alive && f.type !== "jelly" && (!window.canCollectOceanFood || canCollectOceanFood(f))){
      var rr = player.size * 0.5 + f.r;
      if (dist2(f.x, f.y, player.x, player.y) < rr * rr){
        var info = FOOD_INFO[f.type];
        var mult = comboMult() * (player.buffs.double > 0 ? 2 : 1);
        score += info.score * mult;
        player.hunger = Math.min(CONF.HUNGER_MAX, player.hunger + foodNutrition(f.type, info.hunger));
        player.size = Math.min(CONF.P_MAX_SIZE, player.size + foodGrowth(f.type));
        if(window.unlockFoodGuide)unlockFoodGuide(f.type);
        if(f.type==="pearl"&&window.leaveEmptyOyster)leaveEmptyOyster(f);
        ensurePlayerSprite();
        player.gulp = 0.18;
        if (f.type !== "crab" && f.type !== "bluecrab") addCombo();
        var label = f.type === "pearl" ? "珍珠 +" + Math.round(50 * mult) : (f.type === "star" ? "★ +" + Math.round(info.score * mult) : (f.type === "starfish" ? "海星 +" + Math.round(8 * mult) : (f.type === "crab" ? "螃蟹 +" + Math.round(10 * mult) : f.type === "bluecrab" ? "梭子蟹 +" + Math.round(info.score * mult) : "+" + Math.round(info.score * mult))));
        addPopup(f.x, f.y, label, f.type === "pearl" ? "#f3e6f7" : "#ffe082");
        emitParticles(f.x, f.y, 6, info.pIdx);
        sfx(f.type === "pearl" ? 880 : 740, 0.09, "sine", 0.05, f.type === "pearl" ? 1320 : undefined);
        if (f.type === "star" && Math.random() < 0.2) grantRandomBuff();
        f.dead = true;
        continue;
      }
    }
    // 水母蜇
    if (f.type === "jelly" && player.alive && f.stingCd <= 0){
      var rr2 = player.size * 0.45 + f.r;
      if (dist2(f.x, f.y, player.x, player.y) < rr2 * rr2){
        f.stingCd = 1.6;
        if (player.buffs.shield > 0 || player.invulnTimer > 0 || player.spawnProt > 0){
          // 被挡住
        } else {
          player.hunger = Math.max(0, player.hunger - 12);
          player.slowTimer = 1;
          player.hurtFlash = 0.5;
          var dx2 = player.x - f.x, dy2 = player.y - f.y;
          var dd = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
          player.vx += dx2 / dd * 200; player.vy += dy2 / dd * 200;
          addPopup(player.x, player.y - player.size, "被水母蜇了! -饥饿", "#e1a3ff");
          emitParticles(player.x, player.y, 8, 3);
          sfx(150, 0.14, "sawtooth", 0.06, 90);
        }
      }
    }
  }
}

function banner(t){ bannerText = t; bannerTimer = 2.6; }

// ==================== 渲染 ====================
var raySprites = null;
function render(time){
  var i;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#02060d";
  ctx.fillRect(0, 0, W, H);

  var shx = 0, shy = 0;
  if (shakeTimer > 0){
    shx = (Math.random() - 0.5) * shakeI * 2;
    shy = (Math.random() - 0.5) * shakeI * 2;
  }
  var z = cam.z;
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cam.x * z + shx), DPR * (H / 2 - cam.y * z + shy));

  var vL = cam.x - W / (2 * z) - 80, vR = cam.x + W / (2 * z) + 80;
  var vT = cam.y - H / (2 * z) - 80, vB = cam.y + H / (2 * z) + 80;

  // 背景: 低分辨率水色全图一次 blit + 底部海床条带分块
  if (WATER) ctx.drawImage(WATER, 0, 0, CONF.WORLD_W, CONF.WORLD_H);
  if (vB > FSTRIP_Y0){
    for (var si2 = 0; si2 < FSTRIP.length; si2++){
      var fc2 = FSTRIP[si2];
      if (fc2.x > vR || fc2.x + fc2.w < vL) continue;
      ctx.drawImage(fc2.c, fc2.x, FSTRIP_Y0, fc2.w, FSTRIP_H);
    }
  }
  // 焦散水纹(顶部阳光带, 实时正弦线)
  if (qLevel > 0 && vT < 1400){
    ctx.strokeStyle = "rgba(220,250,255,0.05)"; ctx.lineWidth = 3;
    for (var cn = 0; cn < 5; cn++){
      var byC = 120 + cn * 210;
      if (byC < vT - 80 || byC > vB + 80) continue;
      ctx.beginPath();
      for (var x2 = vL; x2 <= vR; x2 += 130){
        var y2 = byC + Math.sin(x2 * 0.011 + cn * 1.7 + time * 0.4) * 34 + Math.sin(x2 * 0.004 + cn) * 22;
        if (x2 === vL) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    }
  }
  // 天空与水面(视口近顶才画) + 远景鱼群剪影(视差)
  SF_draw(time);
  FF_draw(time);
  SN_draw(time);

  drawOceanRelief(time);

  // 世界边缘: 左右岩石峭壁(含向内暗化过渡, 取代空气墙边框)
  if (vL < 460 && SP.cliffL) ctx.drawImage(SP.cliffL, 0, 0, 460, CONF.WORLD_H);
  if (vR > CONF.WORLD_W - 460 && SP.cliffR) ctx.drawImage(SP.cliffR, CONF.WORLD_W - 460, 0, 460, CONF.WORLD_H);

  // Light shafts remain underwater, including at a local cave waterline.
  ctx.save();if(window.clipToCaveWater)clipToCaveWater(ctx);
  if (QRAY[qLevel] > 0 && vT < 1000){
    if (!raySprites) raySprites = [makeRaySprite(150, 620), makeRaySprite(220, 760)];
    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < QRAY[qLevel]; i++){
      var rx = cam.x + (i === 0 ? -620 : 520) + Math.sin(time * 0.25 + i * 2.1) * 60;
      if (rx < vL - 300 || rx > vR + 300) continue;
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(time * 0.4 + i * 1.7);
      var rs = raySprites[i % 2];
      ctx.drawImage(rs, rx - rs.width / 2, 0);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  ctx.restore();

  // 洞穴(画在装饰与鱼后面)
  for (i = 0; i < WORLD_CAVES.length; i++){
    var cvo = WORLD_CAVES[i];
    if (cvo.x < vL - 280 || cvo.x > vR + 280 || cvo.y < vT - 220 || cvo.y > vB + 220) continue;
    var cspr = SP.caves[cvo.glow ? 1 : 0];
    var cw = 240 * cvo.s, ch = 170 * cvo.s;
    ctx.drawImage(cspr, cvo.x - cw / 2, cvo.y - ch, cw, ch);
  }

  // SDF 岩体地形 + 深海遗迹
  RK_draw(time);

  if(window.drawShallowWreck)drawShallowWreck(time);
  // 沉船与热泉
  if (WRECK && WRECK.x > vL - 320 && WRECK.x < vR + 320 && WRECK.y > vT - 340 && WRECK.y < vB + 320){
    ctx.drawImage(SP.wreck, WRECK.x - 280, WRECK.y - 250, 560, 300);
  }
  for (i = 0; i < VENTS.length; i++){
    var vnt = VENTS[i];
    if (vnt.x < vL - 160 || vnt.x > vR + 160 || vnt.y < vT - 780 || vnt.y > vB + 160) continue;
    var vst = ventLift(vnt.x, vnt.y - 30, survivalTime);
    if (qLevel > 0 && vst > 0.08){
      ctx.globalAlpha = 0.16 * vst;
      ctx.drawImage(SP.ventCol, vnt.x - 70, vnt.y - 700, 140, 700);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(SP.vent, vnt.x - 75, vnt.y - 100, 150, 120);
  }

  if(window.drawShallowKelp)drawShallowKelp(time,false);
  // 装饰
  var swayOn = qLevel > 0;
  var localDecors = streamedDecors(vL, vT, vR, vB);
  for (i = 0; i < localDecors.length; i++){
    var dc = localDecors[i];
    if (dc.x < vL - 240 || dc.x > vR + 240 || dc.y < vT - 30 || dc.y > vB + 500) continue;
    var spr = DECOR[dc.z][dc.spr];
    ctx.save();
    ctx.translate(dc.x, dc.y);
    applyRootTransform(dc);
    if (swayOn && !dc.upright) ctx.rotate(Math.sin(time * 0.8 + dc.ph) * 0.05);
    var dw=spr.logicalWidth||spr.width,dh=spr.logicalHeight||spr.height;
    ctx.drawImage(spr, -dw / 2 * dc.s, -dh * dc.s, dw * dc.s, dh * dc.s);
    ctx.restore();
  }

  // 漂浮马尾藻(浅/中层真实悬浮植被) / 巨藻森林(海床长到中层) / 珊瑚尖塔(陆架中上层)
  for (i = 0; i < SARG.length; i++){
    var sg = SARG[i];
    if (sg.x < vL - 200 || sg.x > vR + 200 || sg.y < vT - 160 || sg.y > vB + 160) continue;
    var sprS = SP.sarg[sg.spr];
    ctx.save();
    ctx.translate(sg.x + Math.sin(time * 0.22 + sg.ph) * 14, sg.y + Math.sin(time * 0.5 + sg.ph * 2) * 10);
    // Floating seaweed keeps its vertical growth axis.
    ctx.globalAlpha = 0.92;
    ctx.drawImage(sprS, -(sprS.logicalWidth||sprS.width) / 2 * sg.s, -(sprS.logicalHeight||sprS.height) / 2 * sg.s, (sprS.logicalWidth||sprS.width) * sg.s, (sprS.logicalHeight||sprS.height) * sg.s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < VKELP.length; i++){
    var vk = VKELP[i];
    if (vk.x < vL - 120 || vk.x > vR + 120 || vk.y < vT - 900 || vk.y > vB + 120) continue;
    ctx.save();
    ctx.translate(vk.x, vk.y);applyRootTransform(vk);
    // Upright kelp: roots follow the slope, stems stay vertical.
    ctx.drawImage(SP.giantKelp, -35 * vk.s, -840 * vk.s, 70 * vk.s, 840 * vk.s);
    ctx.restore();
  }
  for (i = 0; i < SPIRES.length; i++){
    var sp3 = SPIRES[i];
    if (sp3.x < vL - 160 || sp3.x > vR + 160 || sp3.y < vT - 700 || sp3.y > vB + 120) continue;
    var spr3 = SP.spires[sp3.spr];
    ctx.save();
    ctx.translate(sp3.x, sp3.y);ctx.rotate(sp3.surfaceAngle||0);
    ctx.rotate(Math.sin(time * 0.3 + sp3.ph) * 0.018);
    ctx.drawImage(spr3, -(spr3.logicalWidth||spr3.width) / 2 * sp3.s, -(spr3.logicalHeight||spr3.height) * sp3.s, (spr3.logicalWidth||spr3.width) * sp3.s, (spr3.logicalHeight||spr3.height) * sp3.s);
    ctx.restore();
  }

  // 气泡
  for (i = 0; i < bubbles.length; i++){
    var bbl = bubbles[i];
    if (!bbl.active) continue;
    if (bbl.x < vL || bbl.x > vR || bbl.y < vT || bbl.y > vB) continue;
    var bs = bbl.type === 1 ? bbl.r * 0.8 : bbl.r;
    ctx.globalAlpha = bbl.type === 1 ? 0.8 : 0.6;
    ctx.drawImage(bbl.type === 1 ? SP.plankton : SP.bubble, bbl.x - bs * 1.4, bbl.y - bs * 1.4, bs * 2.8, bs * 2.8);
  }
  // 海床气泡渗流柱(固定渗点, 气泡自海床升起——有源之水, 串起中层纵深)
  for (i = 0; i < SEEPS.length; i++){
    var sp2 = SEEPS[i];
    if (sp2.x < vL - 60 || sp2.x > vR + 60) continue;
    var fse = floorAt(sp2.x);
    if (fse < vT - 60 || fse - 700 > vB) continue;
    for (var j = 0; j < 5; j++){
      var bt = (time * 42 + j * 47 + sp2.ph * 61) % 640;
      var byy = fse - 14 - bt;
      var bxx = sp2.x + Math.sin(bt * 0.028 + sp2.ph + j) * (10 + bt * 0.05);
      var br2 = 3 + (j % 3) * 2 + bt * 0.012;
      ctx.globalAlpha = 0.5 * (1 - bt / 640) + 0.12;
      ctx.drawImage(SP.bubble, bxx - br2 * 1.4, byy - br2 * 1.4, br2 * 2.8, br2 * 2.8);
    }
  }
  ctx.globalAlpha = 1;

  drawExpeditionWorld(time);

  // 食物
  for (i = 0; i < foods.length; i++){
    var fd = foods[i];
    if (fd.dead) continue;
    if (fd.x < vL || fd.x > vR || fd.y < vT || fd.y > vB) continue;
    drawFood(fd, time);
  }

  // 美人鱼
  if (mermaid) drawMermaid(time);

  // 鱼(危险圈先画: 与画质解耦, 取最近 10 条)
  if (player.alive){
    var ringN = 0;
    for (i = 0; i < fishes.length; i++){
      var fr = fishes[i];
      if (fr.dead || fr.spec.rareDugong || fr.spec.shape === "puff" || fr.size <= player.size * CONF.KILL_RATIO) continue;
      if (fr.x < vL || fr.x > vR || fr.y < vT || fr.y > vB) continue;
      var rdd = dist2(fr.x, fr.y, player.x, player.y);
      if (rdd > 900 * 900) continue;
      if (ringN < 10){
        ringList[ringN].f = fr; ringList[ringN].d = rdd; ringN++;
        for (var rl = ringN - 1; rl > 0; rl--){
          if (ringList[rl].d < ringList[rl - 1].d){ var tmpr = ringList[rl]; ringList[rl] = ringList[rl - 1]; ringList[rl - 1] = tmpr; } else break;
        }
      } else if (rdd < ringList[9].d){
        ringList[9].f = fr; ringList[9].d = rdd;
        for (rl = 9; rl > 0; rl--){
          if (ringList[rl].d < ringList[rl - 1].d){ tmpr = ringList[rl]; ringList[rl] = ringList[rl - 1]; ringList[rl - 1] = tmpr; } else break;
        }
      }
    }
    for (i = 0; i < ringN; i++){
      var rf = ringList[i].f;
      var rsz = rf.size * 2.6;
      ctx.drawImage(SP.ring, rf.x - rsz / 2, rf.y - rsz / 2, rsz, rsz);
    }
  }
  for (i = 0; i < fishes.length; i++){
    var f2 = fishes[i];
    if (f2.dead) continue;
    if (f2.x < vL - f2.size * 2 || f2.x > vR + f2.size * 2 || f2.y < vT - f2.size * 2 || f2.y > vB + f2.size * 2) continue;
    var fade = (survivalTime - f2.born) / 0.4;
    if (fade < 1) ctx.globalAlpha = Math.max(0.1, fade);
    drawFishSprite(f2, f2.x, f2.y, f2.size, f2.angle, f2.tailPhase, f2.inflated, false, time);
    if (fade < 1) ctx.globalAlpha = 1;
    // 猎杀标记: 血色警戒环
    if (f2.huntT > 0){
      var hr = f2.size * 1.7 + Math.sin(time * 9) * 4;
      ctx.strokeStyle = "rgba(255,70,60,0.75)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f2.x, f2.y, hr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(255,90,70,0.95)";
      ctx.font = "bold " + Math.max(16, f2.size * 0.5) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("!", f2.x, f2.y - hr - 6);
    }
  }

  // 玩家
  if (player.alive && (gameState === "playing" || gameState === "paused")) drawPlayer(time);

  if(window.drawOceanForeground)drawOceanForeground(time);

  // 粒子
  for (i = 0; i < particles.length; i++){
    var pp = particles[i];
    if (!pp.active) continue;
    if(window.caveAirAt&&caveAirAt(pp.x,pp.y))continue;
    if (pp.x < vL || pp.x > vR || pp.y < vT || pp.y > vB) continue;
    var alpha = 1 - pp.life / pp.maxLife;
    ctx.globalAlpha = alpha;
    var psz = pp.r * (0.6 + alpha * 0.8);
    ctx.drawImage(SP.part[pp.ci], pp.x - psz * 1.6, pp.y - psz * 1.6, psz * 3.2, psz * 3.2);
  }
  ctx.globalAlpha = 1;
  // 涟漪
  for (i = 0; i < ripples.length; i++){
    var rp = ripples[i];
    if (!rp.active) continue;
    var ralpha = 1 - rp.life / rp.maxLife;
    ctx.strokeStyle = "rgba(200,235,255," + (ralpha * 0.45).toFixed(3) + ")";
    ctx.lineWidth = 2 * ralpha + 0.5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
  }

  // 飘字(世界坐标, 按字号分两遍设置 font 减少状态切换)
  ctx.textAlign = "center";
  var pass, pu2;
  for (pass = 0; pass < 2; pass++){
    ctx.font = (pass === 1 ? "bold 20px " : "bold 14px ") + "system-ui, sans-serif";
    for (i = 0; i < popups.length; i++){
      pu2 = popups[i];
      if (!pu2.active || (pu2.big ? pass !== 1 : pass !== 0)) continue;
      ctx.globalAlpha = 1 - pu2.life / pu2.maxLife;
      ctx.fillStyle = pu2.color;
      ctx.fillText(pu2.text, pu2.x, pu2.y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  // 暗角(屏幕空间)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (qLevel > 0) ctx.drawImage(SP.vignette, 0, 0, W, H); // 低画质跳过全屏暗角

  if(window.drawDepthVisibility)drawDepthVisibility(time);
  // HUD
  if (gameState === "playing" || gameState === "paused") drawHUD(time);
  if (gameState === "start") drawStartScreen(time);
  if (gameState === "paused") drawPauseOverlay();
  if (gameState === "dead") drawDeathScreen();

  if (redFlash > 0){
    ctx.fillStyle = "rgba(255,40,30," + (redFlash * 0.55).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (player.hurtFlash > 0){
    ctx.fillStyle = "rgba(190,80,255," + (player.hurtFlash * 0.3).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

function drawFood(f, time){
  var bob = Math.sin(f.t * 2.4 + f.seed) * 3;
  if (f.type === "pearl"){
    ctx.drawImage(SP.pearl, f.x - 14, f.y - 14 + bob, 28, 28);
    if (Math.sin(time * 2 + f.seed) > 0.86){
      ctx.globalAlpha = 0.8;
      ctx.drawImage(SP.part[0], f.x - 8, f.y - 20, 16, 16);
      ctx.globalAlpha = 1;
    }
  } else if (f.type === "star"){
    ctx.save();
    ctx.translate(f.x, f.y + bob);
    ctx.rotate(Math.sin(f.t * 1.5 + f.seed) * 0.25);
    ctx.drawImage(SP.star, -17, -17, 34, 34);
    ctx.restore();
  } else if (f.type === "starfish"){
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.seed);
    ctx.drawImage(SP.starfish, -15, -15, 30, 30);
    ctx.restore();
  } else if (f.type === "shrimp"){
    var shrimpAngle = Number.isFinite(f.swimAngle) ? f.swimAngle : (f.dir < 0 ? Math.PI : 0);
    ctx.save();
    ctx.translate(f.x, f.y + bob * 0.5);
    ctx.rotate(shrimpAngle);
    if (Math.cos(shrimpAngle) < 0) ctx.scale(1, -1);
    ctx.drawImage(SP.shrimp, -17, -12, 40, 24);
    ctx.restore();
  } else if (f.type === "crab"){
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.dir < 0) ctx.scale(-1, 1);
    ctx.drawImage(SP.crab, -17, -13, 34, 26);
    ctx.restore();
  } else if (f.type === "jelly"){
    var pulse = 1 + Math.sin(f.t * 2.2) * 0.09;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(pulse, 2 - pulse);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(SP.jelly, -22, -34, 44, 56);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawMermaid(time){
  var m = mermaid;
  var bob = Math.sin(m.t * 1.6) * 6;
  ctx.save();
  ctx.translate(m.x, m.y + bob);
  if (m.dir < 0) ctx.scale(-1, 1);
  // 光晕
  ctx.globalAlpha = 0.5 + 0.2 * Math.sin(m.t * 2);
  ctx.drawImage(SP.playerGlow, -70, -70, 140, 140);
  ctx.globalAlpha = 1;
  ctx.drawImage(SP.mermaid, -60, -75, 120, 150);
  ctx.restore();
  // 音符
  if (Math.sin(m.t * 1.1) > 0.55){
    ctx.globalAlpha = 0.8;
    ctx.drawImage(SP.note, m.x + m.dir * 34 - 9, m.y + bob - 46 - (m.t * 12 % 14), 18, 22);
    ctx.globalAlpha = 1;
  }
}

function drawFishSprite(f, x, y, s, angle, tailPhase, inflate, isPlayer, time){
  var spec = isPlayer ? PLAYER_SPEC : f.spec;
  var spr = isPlayer ? SP.player : f.spec.spr;
  var k = (s / spr.bakeR) * (1 + (inflate || 0) * 0.35);
  // 屏幕缩放超过烘焙分辨率→矢量实时绘制(边缘锐利); 否则精灵图(快)
  var vector = k * cam.z * DPR > 1.1;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (Math.cos(angle) < 0) ctx.scale(1, -1);
  var sw = Math.sin(tailPhase) * spr.tailAmp;
  ctx.save();
  ctx.translate(s * (spr.tailX || -0.78), 0);
  ctx.rotate(sw);
  if (vector) bakeTail(ctx, spec.tail, s, spec.c3);
  else ctx.drawImage(spr.tail, -spr.tailLen * k, -spr.tail.height * k / 2, spr.tailLen * k, spr.tail.height * k);
  ctx.restore();
  if (vector){
    if (inflate) ctx.scale(1 + inflate * 0.35, 1 + inflate * 0.35);
    bakeFishBody(ctx, spec, s);
  } else {
    var dw = spr.body.width * k, dh = spr.body.height * k;
    ctx.drawImage(spr.body, -dw / 2, -dh / 2, dw, dh);
  }
  ctx.restore();
}

function drawPlayer(time){
  var s = player.size * (1 + Math.max(0, player.gulp) * 0.5);
  // 光晕
  var gs = s * 4.2;
  ctx.globalAlpha = 0.8;
  ctx.drawImage(SP.playerGlow, player.x - gs / 2, player.y - gs / 2, gs, gs);
  ctx.globalAlpha = 1;
  // 无敌闪烁
  var blink = (player.invulnTimer > 0 || player.spawnProt > 0) && Math.sin(time * 16) > 0;
  ctx.globalAlpha = blink ? 0.45 : 1;
  drawFishSprite(null, player.x, player.y, s, player.angle, player.tailPhase, 0, true, time);
  ctx.globalAlpha = 1;
  // 护盾圈
  if (player.buffs.shield > 0 || player.shieldFlash > 0){
    var ss = s * 3.2;
    ctx.globalAlpha = player.shieldFlash > 0 ? clamp(player.shieldFlash * 1.6, 0, 1) : (0.7 + 0.3 * Math.sin(time * 5));
    ctx.drawImage(SP.shieldRing, player.x - ss / 2, player.y - ss / 2, ss, ss);
    ctx.globalAlpha = 1;
  }
  // 磁铁圈
  if (player.buffs.magnet > 0){
    ctx.strokeStyle = "rgba(255,120,120,0.22)";
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 12]);
    ctx.beginPath(); ctx.arc(player.x, player.y, 300, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ==================== HUD ====================
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function drawHUD(time){
  ctx.save();
  // 左上信息底板(替代 shadowBlur, 省 fillText 阴影开销)
  ctx.fillStyle = "rgba(4,14,28,0.5)";
  rr(8, 12, 252, 72, 8); ctx.fill();
  ctx.font = "bold 15px system-ui, sans-serif";
  ctx.fillStyle = "#fff";
  var mult = comboMult() * (player.buffs.double > 0 ? 2 : 1);
  ctx.fillText("得分 " + Math.floor(score) + (mult > 1 ? "  (x" + mult.toFixed(1).replace(".0", "") + ")" : ""), 16, 30);
  ctx.font = "13px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(STAGES[stageIdx] + " · 体长 " + player.size.toFixed(0) + " · " + Math.floor(survivalTime) + "s", 16, 52);
  if (combo >= 3){
    ctx.fillStyle = "#ffd54f";
    ctx.font = "bold 13px system-ui, sans-serif";
    ctx.fillText("连击 " + combo, 16, 78);
  }

  // 饥饿条
  var barW = 190, barH = 16, barX = W - barW - 16, barY = 14;
  var ratio = clamp(player.hungerShow / CONF.HUNGER_MAX, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  rr(barX - 2, barY - 2, barW + 4, barH + 4, 5); ctx.fill();
  var bc;
  if (player.hungerShow > 60) bc = "hsl(" + (80 + (player.hungerShow - 60) / 40 * 60) + ",75%,50%)";
  else if (player.hungerShow > 30) bc = "hsl(" + (30 + (player.hungerShow - 30) / 30 * 50) + ",82%,50%)";
  else bc = "hsl(" + (8 + Math.sin(time * 6) * 4) + ",85%," + (45 + Math.sin(time * 6) * 6) + "%)";
  if (ratio > 0.01){
    ctx.fillStyle = bc;
    rr(barX, barY, barW * ratio, barH, 4); ctx.fill();
  }
  ctx.fillStyle = "#fff";
  ctx.font = "bold 10px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("饥饿 " + Math.round(player.hungerShow), barX + barW / 2, barY + barH - 4);
  ctx.textAlign = "left";

  // Buff 图标
  var bx = barX, by = barY + 26;
  var icons = [["magnet", SP.buffMagnet], ["speed", SP.buffSpeed], ["shield", SP.buffShield], ["double", SP.buffDouble]];
  for (var i = 0; i < icons.length; i++){
    var tLeft = player.buffs[icons[i][0]];
    if (tLeft <= 0) continue;
    ctx.drawImage(icons[i][1], bx, by, 26, 26);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(Math.ceil(tLeft), bx + 13, by + 38);
    ctx.textAlign = "left";
    bx += 32;
  }

  // 小地图
  if (MINIMAP_BASE){
    var mw = MINIMAP_BASE.width, mh = MINIMAP_BASE.height;
    var mmX = W - mw - 12, mmY = H - mh - 12;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(MINIMAP_BASE, mmX, mmY);
    ctx.globalAlpha = 1;
    var sc = mw / CONF.WORLD_W;
    function dot(x, y, col, r){
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(mmX + x * sc, mmY + y * sc, r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (mermaid) dot(mermaid.x, mermaid.y, "#ff9ad5", 3);
    for (var pi2 = 0; pi2 < foods.length; pi2++){
      if (foods[pi2].type === "pearl") dot(foods[pi2].x, foods[pi2].y, "#f3e6f7", 1.6);
    }
    // 视野框: 预判哪些红点即将进屏
    var halfWv = W / (2 * cam.z), halfHv = H / (2 * cam.z);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1;
    ctx.strokeRect(mmX + (player.x - halfWv) * sc, mmY + (player.y - halfHv) * sc, halfWv * 2 * sc, halfHv * 2 * sc);
    dot(player.x, player.y, "#ffcf4d", 3);
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mmX + player.x * sc, mmY + player.y * sc, 5 + Math.sin(time * 4) * 1.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 群系横幅
  if (bannerTimer > 0 && bannerText){
    var ba = Math.min(1, bannerTimer / 0.5);
    ctx.globalAlpha = ba;
    ctx.font = "bold 17px system-ui, sans-serif";
    var tw2 = ctx.measureText(bannerText).width;
    ctx.fillStyle = "rgba(0,20,40,0.55)";
    rr(W / 2 - tw2 / 2 - 16, 14, tw2 + 32, 30, 8); ctx.fill();
    ctx.fillStyle = "#cfeaff";
    ctx.textAlign = "center";
    ctx.fillText(bannerText, W / 2, 35);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  // 饥饿警告
  if (player.hunger <= CONF.HUNGER_LOW && player.alive){
    var pulse2 = 0.55 + 0.35 * Math.sin(time * 6);
    ctx.fillStyle = "rgba(255,60,50," + pulse2.toFixed(2) + ")";
    ctx.font = "bold 16px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(player.hunger <= 0 ? "饥饿! 快吃东西!" : "饿了! 快吃小鱼/珍珠", W / 2, 76);
    ctx.textAlign = "left";
  }
  // 开局提示
  if (survivalTime < 9){
    ctx.globalAlpha = clamp(9 - survivalTime, 0, 1) * 0.85;
    ctx.fillStyle = "#cfeaff";
    ctx.font = "13px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("移动鼠标游动 · 按住左键/双指冲刺 · Shift 也可冲刺", W / 2, H - 46);
    ctx.fillText("红色虚线圈 = 能吃你的大鱼, 快跑!", W / 2, H - 26);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

  ctx.textAlign = "center";

  ctx.fillText("V3 大世界版", W / 2, H / 2 - 100);

  var lines = [

    "连续快速进食触发连击倍率",
    "",
    "操作: 鼠标/触摸移动 · 按住左键或第二根手指冲刺 · WASD 也可",
    "空格暂停 · R 重开 · M 静音"
  ];
  for (var i = 0; i < lines.length; i++){
    ctx.fillText(lines[i], W / 2, H / 2 - 58 + i * 26);
  }
  var pulse = 0.6 + 0.4 * Math.sin(time * 3);
  ctx.fillStyle = "rgba(255,235,120," + pulse.toFixed(2) + ")";
  ctx.font = "bold 21px system-ui, sans-serif";
  ctx.fillText("点 击 开 始", W / 2, H / 2 + 148);
  ctx.textAlign = "left";
}
function drawPauseOverlay(){
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 30px system-ui, sans-serif";
  ctx.fillText("已暂停", W / 2, H / 2 - 10);
  ctx.font = "15px system-ui, sans-serif";
  ctx.fillText("按空格继续 · R 重新开始", W / 2, H / 2 + 26);
  ctx.textAlign = "left";
}
function drawDeathScreen(){
  ctx.fillStyle = "rgba(2,8,18,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff7a66";
  ctx.font = "bold 34px system-ui, sans-serif";
  ctx.fillText("游戏结束", W / 2, H / 2 - 110);
  ctx.fillStyle = "#fff";
  ctx.font = "17px system-ui, sans-serif";
  ctx.fillText("得分 " + Math.floor(score), W / 2, H / 2 - 64);
  ctx.font = "14px system-ui, sans-serif";
  ctx.fillStyle = "#cfe3f5";
  ctx.fillText("吃掉 " + eatCount + " 条 · 存活 " + Math.floor(survivalTime) + " 秒", W / 2, H / 2 - 34);
  ctx.fillText("最终形态: " + STAGES[stageIdx] + " · 最大猎物体长 " + Math.round(biggestCatch), W / 2, H / 2 - 8);
  ctx.fillStyle = "#ffaa88";
  ctx.fillText(deathReason, W / 2, H / 2 + 22);
  ctx.fillStyle = "#aaddff";
  ctx.fillText("按 R 或点击重新开始", W / 2, H / 2 + 60);
  ctx.textAlign = "left";
}

// ==================== 主循环 ====================
function gameLoop(ts){
  var dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.016;
  // 视觉计时器与状态无关地衰减(修复: 死亡/暂停画面永久抖动+红闪)
  if (shakeTimer > 0) shakeTimer -= dt;
  if (redFlash > 0) redFlash -= dt;
  if (player.hurtFlash > 0) player.hurtFlash -= dt;
  if (zoomPulse > 0) zoomPulse -= dt * 0.8;
  if (bannerTimer > 0) bannerTimer -= dt;
  update(dt);
  render(ts / 1000);
  requestAnimationFrame(gameLoop);
}

// ==================== 输入 ====================
function startOrRestart(){
  initAudio();
  if (gameState === "start" || gameState === "dead"){
    resetGame();
    gameState = "playing";
  }
}
canvas.addEventListener("pointermove", function(e){
  mouseSX = e.clientX; mouseSY = e.clientY;
});
canvas.addEventListener("pointerdown", function(e){
  initAudio();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {} // 画布外松开也能收到 up
  mouseSX = e.clientX; mouseSY = e.clientY;
  touchCount++;
  sprintPointer = (e.pointerType === "mouse") ? ((e.buttons & 1) !== 0 || touchCount > 1) : (touchCount > 1);
  startOrRestart();
});
canvas.addEventListener("pointerup", function(e){
  touchCount = Math.max(0, touchCount - 1);
  if (touchCount === 0) sprintPointer = false;
});
canvas.addEventListener("pointercancel", function(){
  touchCount = 0; sprintPointer = false;
});
canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
document.addEventListener("keydown", function(e){
  keys[e.code] = true;
  if (e.repeat) return; // 防按住自动重复翻转暂停/重开
  if (e.code === "Space"){
    e.preventDefault();
    if (gameState === "playing") gameState = "paused";
    else if (gameState === "paused") gameState = "playing";
  }
  if (e.code === "KeyR" && gameState !== "start"){
    resetGame();
    gameState = "playing";
  }
  if (e.code === "KeyM"){ muted = !muted; banner(muted ? "已静音" : "声音开启"); }
});
document.addEventListener("keyup", function(e){ keys[e.code] = false; });
window.addEventListener("resize", resizeCanvas);
window.addEventListener("blur", function(){
  keys = {}; sprintPointer = false; touchCount = 0; // 切走窗口清残留输入
  if (gameState === "playing") gameState = "paused";
});

// ==================== 初始化 ====================
function resetGame(){
  var i;
  score = 0; eatCount = 0; survivalTime = 0;
  combo = 0; comboTimer = 0;
  shakeTimer = 0; redFlash = 0; zoomPulse = 0;
  bannerText = ""; bannerTimer = 0;
  deathReason = ""; biggestCatch = 0;
  stageIdx = 0; lastBiome = -1;
  spawnTimerAcc = 0;
  mermaid = null; mermaidNext = CONF.MERMAID_FIRST;
  mermaidStarT = 0;
  foodTimers.shrimp = 0; foodTimers.pearl = 0; foodTimers.starfish = 0; foodTimers.jelly = 0; foodTimers.crab = 0;
  // 清空实体
  for (i = 0; i < fishes.length; i++) fishPool.push(fishes[i]);
  fishes.length = 0;
  for (i = 0; i < foods.length; i++) foodPool.push(foods[i]);
  foods.length = 0;
  for (i = 0; i < particles.length; i++) particles[i].active = false;
  for (i = 0; i < ripples.length; i++) ripples[i].active = false;
  for (i = 0; i < popups.length; i++) popups[i].active = false;
  for (i = 0; i < bubbles.length; i++) bubbles[i].active = false;
  // 玩家
  player.x = CONF.WORLD_W / 2; player.y = CONF.WORLD_H / 2;
  player.breachT = 0; SF_prevAir = false;
  player.vx = 0; player.vy = 0;
  player.size = CONF.P_INIT_SIZE;
  ensurePlayerSprite();
  player.angle = 0; player.tailPhase = 0;
  player.hunger = CONF.HUNGER_MAX; player.hungerShow = CONF.HUNGER_MAX;
  player.gulp = 0; player.alive = true;
  player.spawnProt = 3; player.invulnTimer = 0; player.shieldFlash = 0;
  player.starving = false; player.starveAcc = 0; player.shrinkAcc = 0;
  player.slowTimer = 0; player.hurtFlash = 0;
  player.buffs.magnet = 0; player.buffs.speed = 0; player.buffs.shield = 0; player.buffs.double = 0;
  cam.x = player.x; cam.y = player.y; cam.z = CONF.ZOOM_MAX * cameraViewportScale();
  // 初始鱼群与食物(流送: 围绕出生点环带铺开)
  for (i = 0; i < 24; i++) spawnFish(true);
  for (i = 0; i < 16; i++) spawnFood("shrimp");
  for (i = 0; i < 3; i++) spawnFood("pearl");
  for (i = 0; i < 4; i++) spawnFood("starfish");
  for (i = 0; i < 3; i++) spawnFood("jelly");
  for (i = 0; i < 6; i++) spawnFood("crab");
  // 气泡
  for (i = 0; i < QBUB[qLevel]; i++) spawnBubble();
}

// ==================== 分阶段启动 ====================
(async function bootGame(){
  try {
    var phases = [bakeAllSprites, bakeBackgrounds, FF_init, SF_init, gridInit, initPools, resizeCanvas, resetGame];
    for (var phase = 0; phase < phases.length; phase++){
      await new Promise(function(resolve){requestAnimationFrame(function(){setTimeout(resolve,0);});});
      phases[phase]();
    }
    gameState = "start";
    mouseSX = W / 2; mouseSY = H / 2;
    lastTime = performance.now();
    STREAM.ready = true;
    el('t-start').disabled = false;
    syncUI();
    requestAnimationFrame(gameLoop);
  } catch (e){
    document.body.innerHTML = "<pre style='color:#faa;padding:20px'>初始化失败: " + (e && e.message) + "\n" + (e && e.stack) + "</pre>";
  }
})();
</script>
